<script>
/* === systems/gathering.js === */
(function(){
  const D = window.Duskfall = window.Duskfall || {};
  D.GatheringSystem=function(game){
    this.game=game;
    this.nodes=[];
    this.active=null;
    this.timer=0;
    this.duration=3;
    this.respawnTime=10;
    this.seeded=false;
  };
  D.GatheringSystem.prototype.nodeLabel=function(node){
    if(!node)return 'Gathering';
    if(node.cfg)return `${node.cfg.action||'Gather'}: ${node.cfg.name}`;
    return 'Chop: Harvest Tree';
  };
  D.GatheringSystem.prototype.gatherDuration=function(node){
    if(!node||!node.cfg)return 3;
    const p=this.game.player, lvl=D.levelForXp(p.skills[node.cfg.skill]?.xp||0), tool=p.stats()[node.cfg.skill]||0;
    return D.clamp(3.4 + (node.cfg.tier||1)*.45 - (lvl+tool)*.10,1.3,5.2);
  };
  D.GatheringSystem.prototype.ensureNodes=function(){
    const g=this.game;
    if(this.seeded||!g.world||!g.player)return;
    this.seeded=true;
    const nodes=[];
    const tries=260;
    for(let i=0;i<tries&&nodes.length<3;i++){
      const angle=Math.random()*Math.PI*2;
      const dist=160+Math.random()*360;
      let x=D.clamp(g.player.x+Math.cos(angle)*dist,D.TILE*3,D.WORLD.pxW-D.TILE*3);
      let y=D.clamp(g.player.y+Math.sin(angle)*dist,D.TILE*3,D.WORLD.pxH-D.TILE*3);
      const tx=Math.floor(x/D.TILE),ty=Math.floor(y/D.TILE);
      const tileId=g.world.tiles[ty]?.[tx];
      if(!tileId||D.TILES[tileId]?.solid||tileId==='water')continue;
      if(nodes.some(n=>Math.hypot(n.x-x,n.y-y)<140))continue;
      nodes.push({id:'tree_'+nodes.length,x,y,r:34,active:true,respawn:0,type:'tree'});
    }
    while(nodes.length<3){
      const n=nodes.length;
      nodes.push({id:'tree_'+n,x:g.player.x+(n-1)*120,y:g.player.y+190+n*40,r:34,active:true,respawn:0,type:'tree'});
    }
    this.nodes=nodes;
  };
  D.GatheringSystem.prototype.tryStartAt=function(x,y){
    this.ensureNodes();
    const g=this.game,p=g.player;
    if(!p)return false;
    let node=this.nodes.find(n=>n.active&&Math.hypot(n.x-x,n.y-y)<=n.r+24&&Math.hypot(n.x-p.x,n.y-p.y)<=92);
    if(!node){
      node=g.entities.resources.find(r=>r.amount>0&&Math.hypot(r.x-x,r.y-y)<=r.r+26&&Math.hypot(r.x-p.x,r.y-p.y)<=96);
    }
    if(!node)return false;
    if(node.cfg){
      const level=D.levelForXp(p.skills[node.cfg.skill]?.xp||0);
      if(level<node.cfg.level){g.ui.toast('Level too low',`${node.cfg.name} requires ${D.SKILLS[node.cfg.skill].name} level ${node.cfg.level}.`,'bad');return true;}
    }
    this.active=node;
    this.duration=this.gatherDuration(node);
    this.timer=0;
    if(p){p.gathering=true;p.blocking=false;p.heavyCharging=false;}
    if(g.input?.mouse){g.input.mouse.leftDown=false;g.input.mouse.rightDown=false;}
    g.ui.log(`Started ${this.nodeLabel(node).toLowerCase()}.`,'gold');
    return true;
  };
  D.GatheringSystem.prototype.cancel=function(){
    if(this.game.player)this.game.player.gathering=false;
    this.active=null;
    this.timer=0;
  };
  D.GatheringSystem.prototype.finish=function(){
    const g=this.game,node=this.active;
    if(!node){this.cancel();return;}
    if(node.cfg){
      const p=g.player,cfg=node.cfg;
      const lvl=D.levelForXp(p.skills[cfg.skill]?.xp||0), tool=p.stats()[cfg.skill]||0;
      const ok=D.rollSkillSuccess(lvl+tool,cfg.difficulty);
      if(!ok){
        g.ui.floatText(p.x,p.y-35,'Failed','#9aa8c7');
        if(g.systems.skills) g.systems.skills.addXp(cfg.skill,Math.max(1,Math.floor(cfg.xp*.15)));
        this.cancel();return;
      }
      let qty=1+(Math.random()<.10+(p.mods.extraGather||0)?1:0);
      qty=Math.min(qty,node.amount);
      const item=(cfg.altItem&&Math.random()<(cfg.altChance||0))?cfg.altItem:cfg.item;
      node.amount-=qty;
      g.systems.inventory.add(item,qty);
      if(g.systems.skills) g.systems.skills.addXp(cfg.skill,cfg.xp*qty);
      if(g.systems.quests) g.systems.quests.notify('gather',item,qty);
      g.stats.resourcesGathered+=qty;
      g.ui.floatText(p.x,p.y-42,`+${qty} ${D.ITEMS[item]?.name||item}`,'#38d978');
      if(node.amount<=0){node.cooldown=cfg.respawn;g.ui.log(`${cfg.name} depleted.`, 'gold');}
    }else{
      node.active=false;
      node.respawn=this.respawnTime;
      g.systems.inventory.add('log',1);
      if(g.systems.skills) g.systems.skills.addXp('woodcutting',12);
      if(g.systems.quests) g.systems.quests.notify('gather','log',1);
      g.ui.floatText(g.player.x,g.player.y-42,'+1 Wood','#38d978');
      g.ui.log('Collected 1 Wood. The tree will regrow soon.','good');
    }
    this.cancel();
  };
  D.GatheringSystem.prototype.update=function(dt){
    this.ensureNodes();
    const g=this.game,p=g.player;
    this.nodes.forEach(n=>{if(!n.active&&n.respawn>0){n.respawn-=dt;if(n.respawn<=0){n.active=true;n.respawn=0;g.ui.log('A harvest tree has regrown.','gold');}}});
    if(!this.active||!p)return;
    if(!this.active.active){this.cancel();return;}
    if(Math.hypot(this.active.x-p.x,this.active.y-p.y)>112){g.ui.log(`You moved too far away and stopped ${this.nodeLabel(this.active).toLowerCase()}.`,'bad');this.cancel();return;}
    this.timer+=dt;
    if(this.timer>=this.duration)this.finish();
  };
})();
</script>

    const g=this.game;
    g.buildMode=!g.buildMode;
    if(g.player){g.player.blocking=false;g.input.mouse.rightDown=false;g.input.mouse.leftDown=false;}
    g.ui.toast('Build Mode', g.buildMode?`ON — ${D.TILES[this.selected()].name}. LMB place, RMB remove.`:'OFF — combat controls restored.', g.buildMode?'gold':'good');
  };
  D.BuildSystem.prototype.cycle=function(){
    this.index=(this.index+1)%this.palette.length;
    this.game.ui.toast('Build Tile', D.TILES[this.selected()].name, 'gold');
  };
  D.BuildSystem.prototype.canEdit=function(tx,ty){
    const g=this.game,p=g.player;
    if(!p||tx<0||ty<0||tx>=D.WORLD.w||ty>=D.WORLD.h)return false;
    const wx=tx*D.TILE+D.TILE/2, wy=ty*D.TILE+D.TILE/2;
    if(Math.hypot(wx-p.x,wy-p.y)>165){g.ui.toast('Too Far','Move closer to build there.','bad');return false;}
    if(g.entities.npcs.some(n=>Math.hypot(wx-n.x,wy-n.y)<58)){g.ui.toast('Blocked','You cannot build on town NPCs.','bad');return false;}
    if(g.entities.enemies.some(e=>!e.dead&&Math.hypot(wx-e.x,wy-e.y)<44)){g.ui.toast('Blocked','Clear nearby mobs before building.','bad');return false;}
    return true;
  };
  D.BuildSystem.prototype.placeAt=function(x,y){
    const g=this.game, tx=Math.floor(x/D.TILE), ty=Math.floor(y/D.TILE);
    if(!this.canEdit(tx,ty))return;
    const current=g.world.tiles[ty]?.[tx], tile=this.selected();
    if(!current||['water','wall','roof'].includes(current)){g.ui.toast('Cannot Build','That tile cannot be replaced yet.','bad');return;}
    const cost=this.costs[tile]||{};
    if(!g.systems.inventory.canAfford(cost)){g.ui.toast('Need Materials',Object.entries(cost).map(([id,q])=>`${q} ${D.ITEMS[id].name}`).join(', '),'bad');return;}
    g.systems.inventory.take(cost);
    g.world.tiles[ty][tx]=tile;
    g.ui.floatText(tx*D.TILE+D.TILE/2,ty*D.TILE+D.TILE/2,'BUILD','#f7c65b');
    g.ui.log(`Placed ${D.TILES[tile].name}.`,'gold');
  };
  D.BuildSystem.prototype.removeAt=function(x,y){
    const g=this.game, tx=Math.floor(x/D.TILE), ty=Math.floor(y/D.TILE);
    if(!this.canEdit(tx,ty))return;
    const current=g.world.tiles[ty]?.[tx];
    if(!this.palette.includes(current)){g.ui.toast('Cannot Remove','Only player-built tiles can be removed right now.','bad');return;}
    g.world.tiles[ty][tx]='dirt';
    g.ui.floatText(tx*D.TILE+D.TILE/2,ty*D.TILE+D.TILE/2,'REMOVED','#9aa8c7');
    g.ui.log(`Removed ${D.TILES[current].name}.`,'good');
  };
})();
</script>
<script>
/* === systems/dungeon.js === */
(function(){
  const D = window.Duskfall = window.Duskfall || {};
  D.DungeonSystem=function(game){this.game=game;this.inside=false;this.returnPos=null;};
  D.DungeonSystem.prototype.enter=function(id){
    const g=this.game;if(id!=='dungeon')return;
    if(this.inside){this.exit();return;}
    this.returnPos={x:g.player.x,y:g.player.y};this.inside=true;
    g.ui.toast('Old Catacombs','A compact dungeon prototype begins. Defeat the ambush.','gold');
    g.player.x=D.WORLD.pxW/2;g.player.y=D.WORLD.pxH/2+420;g.camera.snapTo(g.player.x,g.player.y);
    // spawn an encounter around player
    for(let i=0;i<5;i++){const a=i/5*Math.PI*2;g.entities.enemies.push(D.createEnemy(i===4?'lurker':'husk',g.player.x+Math.cos(a)*180,g.player.y+Math.sin(a)*140));}
  };
  D.DungeonSystem.prototype.exit=function(){
    const g=this.game;if(!this.returnPos)return;g.player.x=this.returnPos.x;g.player.y=this.returnPos.y;g.camera.snapTo(g.player.x,g.player.y);this.inside=false;g.ui.toast('Returned','You step back into the overworld.','good');
  };
  D.DungeonSystem.prototype.update=function(){
    if(!this.inside)return;
    const g=this.game,p=g.player;
    if(this.returnPos && Math.hypot(p.x-D.WORLD.pxW/2,p.y-(D.WORLD.pxH/2+420))>520){this.exit();}
  };
})();
</script>

<script>

(function(){

<script>
/* === ui/hud.js === */
(function(){
  const D = window.Duskfall = window.Duskfall || {};
  D.UI.prototype.renderHUD=function(){
    const g=this.game, root=document.getElementById('hud');
    if(!g.player||g.state==='menu'){root.innerHTML='';return;}
    const p=g.player, combatLvl=D.levelForXp(p.skills.combat.xp), totalLvl=Object.values(p.skills).reduce((a,s)=>a+D.levelForXp(s.xp),0);
    const hpPct=p.hp/p.maxHp*100;
    const next=D.xpForLevel(combatLvl+1), cur=D.xpForLevel(combatLvl), xpPct=(p.skills.combat.xp-cur)/Math.max(1,next-cur)*100;
    root.innerHTML=`
      <div class="hud-left">
        <div class="hud-card brand"><div class="brand-mark"></div><div><h1>UNK-SCAPE</h1><small>${g.systems.daynight.label()} • Day ${Math.floor(g.time/g.systems.daynight.dayLength)+1} • ${g.entities.enemies.length} mobs • ${g.camera.modeLabel()}</small></div></div>
        <div class="hud-card bars">
          <div class="bar-wrap"><span>Health</span><div class="bar hp"><i style="width:${hpPct}%"></i></div><b>${Math.ceil(p.hp)}/${p.maxHp}</b></div>
          <div class="bar-wrap"><span>Combat</span><div class="bar xp"><i style="width:${D.clamp(xpPct,0,100)}%"></i></div><b>Lv ${combatLvl}</b></div>
        </div>
        <div class="hud-card stat-row">
          <span class="pill gold"><i class="dot"></i>${g.systems.inventory.count('coin')} coins</span>
          <span class="pill green"><i class="dot"></i>Total Lv ${totalLvl}</span>
          <span class="pill purple"><i class="dot"></i>Zoom ${Math.round(g.camera.targetZoom*100)}%</span>
          <span class="pill orange"><i class="dot"></i>Hunger ${g.settings.hungerEnabled?'On':'Off'}</span>
          <span class="pill"><i class="dot"></i>Build ${g.buildMode?'On':'Off'}</span>
          <span class="pill gold"><i class="dot"></i>${p.factionName||'No Faction'}</span>
        </div>
      </div>
      <div class="hud-right">
        <div class="hud-card minimap"><canvas id="minimap" width="164" height="164"></canvas></div>
      </div>`;
    this.drawMinimap();
  };
  D.UI.prototype.renderCombatUI=function(){
    const el=document.getElementById('combat-ui'), g=this.game, p=g.player;
    if(!el||!p||g.state==='menu'){if(el)el.innerHTML='';return;}
    const charge=D.clamp((p.heavyCharge||0)/Math.max(.01,(g.systems.combat?.maxCharge||1.25)-(g.systems.combat?.heavyThreshold||.72)),0,1)*100;
    el.innerHTML=`<div class="combat-card">
      <div class="combat-chip ${p.heavyCharging?'active':''}">⚔️ ${g.buildMode?'Place':p.heavyCharging?'Heavy Charging':'Tap Attack'}</div>
      <div class="charge-meter"><i style="width:${charge}%"></i></div>
      <div class="combat-chip ${p.blocking?'blocking':''}">🛡️ ${g.buildMode?'Remove':p.blocking?'Guarding':'Guard'}</div>
      <div class="combat-chip ${g.buildMode?'active':''}">🛠️ Build ${g.buildMode?D.TILES[g.systems.build.selected()].name:'Off'}</div>
    </div>`;
  };
  D.UI.prototype.renderHotbar=function(){
    const el=document.getElementById('hotbar'), g=this.game, p=g.player;
    if(!el||!p||g.state==='menu'){if(el)el.innerHTML='';return;}
    const slots=g.hotbar?.slots||[];
    el.innerHTML=`<div class="hotbar-card">${slots.map((id,i)=>{
      const it=D.ITEMS[id]||{name:id,icon:'❔'};
      const equipped=Object.values(p.equipment||{}).includes(id);
      const qty=g.systems.inventory.count(id)+(equipped?1:0);
      const selected=g.hotbar.selected===i || (equipped && ['weapon','tool'].includes(it.slot||''));
      return `<div class="hotbar-slot ${selected?'selected':''} ${qty<=0?'missing':''}" title="${it.name}"><span class="num">${i+1}</span><span class="ico">${it.icon}</span>${qty>1?`<span class="qty">x${qty}</span>`:''}<span class="name">${it.name}</span></div>`;
    }).join('')}</div>`;
  };
  D.UI.prototype.drawMinimap=function(){
    const c=document.getElementById('minimap'); if(!c||!this.game.world)return; const ctx=c.getContext('2d'), g=this.game;
    const W=164,H=164;ctx.clearRect(0,0,W,H);
    const sx=W/D.WORLD.w, sy=H/D.WORLD.h;
    for(let y=0;y<D.WORLD.h;y+=2)for(let x=0;x<D.WORLD.w;x+=2){ctx.fillStyle=D.TILES[g.world.tiles[y][x]].color;ctx.fillRect(x*sx,y*sy,Math.ceil(sx*2),Math.ceil(sy*2));}
    ctx.fillStyle='#63e6a4';g.entities.npcs.forEach(n=>ctx.fillRect(n.x/D.TILE*sx-1,n.y/D.TILE*sy-1,3,3));
    ctx.fillStyle='#ff5c7a';g.entities.enemies.slice(0,90).forEach(e=>ctx.fillRect(e.x/D.TILE*sx,e.y/D.TILE*sy,2,2));
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(g.player.x/D.TILE*sx,g.player.y/D.TILE*sy,3,0,Math.PI*2);ctx.fill();
    ctx.save();
    ctx.translate(g.player.x/D.TILE*sx,g.player.y/D.TILE*sy);
    ctx.rotate(g.camera.targetAngle||g.camera.angle||0);
    ctx.strokeStyle='#f7c65b';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,-9);ctx.lineTo(5,4);ctx.lineTo(0,1);ctx.lineTo(-5,4);ctx.closePath();ctx.stroke();
    ctx.restore();
  };
})();
</script>

<script>
/* === ui/dialogs.js === */
(function(){
  const D = window.Duskfall = window.Duskfall || {};
  D.UI.prototype.openDialog=function(npc){this.dialogNpc=npc;this.game.paused=true;document.getElementById('dialog').classList.add('show');this.renderDialog();this.syncLayoutState();};
  D.UI.prototype.closeDialog=function(){this.dialogNpc=null;document.getElementById('dialog').classList.remove('show');this.game.paused=false;this.syncLayoutState();};
  D.UI.prototype.renderDialog=function(){
    const npc=this.dialogNpc;if(!npc)return; const cfg=npc.cfg, el=document.getElementById('dialog');
    if(npc.id==='trader') return this.renderShop(npc);
    if(npc.id==='banker') return this.openPanel('bank');
    el.innerHTML=`<div class="dialog-box"><div class="dialog-top"><div class="portrait">${cfg.icon}</div><div><h3>${cfg.name}</h3><small style="color:var(--muted)">${cfg.role}</small></div></div><div class="dialog-text">${cfg.lines[Math.floor(Math.random()*cfg.lines.length)]}</div><div class="dialog-actions"><button class="action-btn" onclick="Duskfall.game.ui.openPanel('quests')">Open Quests</button><button class="action-btn" onclick="Duskfall.game.ui.closeDialog()">Leave</button></div></div>`;
  };
  D.UI.prototype.renderShop=function(npc){
    const el=document.getElementById('dialog'), inv=this.game.systems.inventory;
    const buy=npc.cfg.shop.buy.map(id=>`<div class="shop-row"><div>${D.ITEMS[id].icon} <b>${D.ITEMS[id].name}</b><small>${D.ITEMS[id].desc}</small></div><span class="coin">${D.priceOf(id)} 🪙</span><button class="small-btn" onclick="Duskfall.game.systems.economy.buy('${id}')">Buy</button></div>`).join('');
    const sell=Object.keys(inv.items).filter(id=>id!=='coin').map(id=>`<div class="shop-row"><div>${D.ITEMS[id].icon} <b>${D.ITEMS[id].name}</b><small>You own x${inv.count(id)}</small></div><span class="coin">${Math.max(1,Math.floor(D.priceOf(id)*.55))} 🪙</span><button class="small-btn" onclick="Duskfall.game.systems.economy.sell('${id}')">Sell 1</button></div>`).join('')||'<div class="help-note">Nothing to sell.</div>';
    el.innerHTML=`<div class="dialog-box"><div class="dialog-top"><div class="portrait">${npc.cfg.icon}</div><div><h3>${npc.cfg.name}</h3><small style="color:var(--muted)">Coins: ${inv.count('coin')}</small></div></div><div class="dialog-text"><div class="two-col"><div><h3>Buy</h3>${buy}</div><div><h3>Sell</h3>${sell}</div></div></div><div class="dialog-actions"><button class="action-btn" onclick="Duskfall.game.ui.closeDialog()">Leave</button></div></div>`;
  };
})();
</script>
<script>
/* === ui/toasts.js === */
(function(){
  const D = window.Duskfall = window.Duskfall || {};
  D.UI.prototype.toast=function(title,msg,type=''){
    const root=document.getElementById('toasts'), id=++this.toastId;
    const div=document.createElement('div');div.className='toast '+type;div.dataset.id=id;div.innerHTML=`<b>${title}</b>${msg}`;root.appendChild(div);
    setTimeout(()=>{div.style.opacity='0';div.style.transform='translateY(-8px)';},3300);
    setTimeout(()=>div.remove(),3800);
  };
})();
</script>
<script>
/* === ui/log.js === */
(function(){
  const D = window.Duskfall = window.Duskfall || {};
  D.UI.prototype.log=function(msg,type=''){
    const root=document.getElementById('log');
    if(!root.querySelector('.log-box')) root.innerHTML='<div class="log-box"></div>';
    const box=root.querySelector('.log-box'), line=document.createElement('div');line.className='log-line '+type;line.textContent='› '+msg;box.appendChild(line);
    while(box.children.length>4)box.removeChild(box.firstChild);
  };
})();
</script>
<script>
/* === ui/menu.js === */
(function(){
  const D = window.Duskfall = window.Duskfall || {};
  D.UI.prototype.showMenu=function(){document.getElementById('menu').classList.add('show');this.game.paused=true;this.renderMenu();this.syncLayoutState();};
  D.UI.prototype.toggleMenu=function(){
    const m=document.getElementById('menu');
    if(m.classList.contains('show')&&this.game.state==='play'){m.classList.remove('show');this.game.paused=false;this.syncLayoutState();}
    else this.showMenu();
  };
  D.UI.prototype.renderMenu=function(){
    const g=this.game;
    if(g.state==='play') return this.renderPauseMenu();
    const saved=g.systems.save?.load();
    document.getElementById('menu').innerHTML=`<div class="menu-card"><h1>UNK-SCAPE</h1><p>A retro medieval survival sandbox/MMO prototype where UNK gaming meets base-building, class islands, faction turf wars, skilling, crafting, mobs, banking, quests, and action combat.</p><div class="help-note">Choose a class island, pick one of its two factions, then complete world quests to claim turf and unlock territory buffs.</div><h3>Choose Class + Faction</h3><div class="class-grid">${Object.entries(D.CLASSES).map(([id,c])=>`<div class="class-card"><h3>${c.icon} ${c.name}</h3><p>${c.desc}</p><p><b>Zone:</b> ${c.zone||'Central Crossroads'}</p><ul>${Object.entries(c.items||{}).slice(0,4).map(([it,q])=>`<li>${D.ITEMS[it]?.icon||''} ${D.ITEMS[it]?.name||it} x${q}</li>`).join('')}</ul><div class="menu-actions" style="justify-content:flex-start;margin-top:12px">${D.getClassFactions(id).map(fid=>`<button class="small-btn" onclick="Duskfall.game.newGame('${id}','${fid}')">${D.FACTIONS[fid].icon} ${D.FACTIONS[fid].name}</button>`).join('')}</div></div>`).join('')}</div><div class="menu-actions">${saved?`<button class="big-btn" onclick="Duskfall.game.loadGame(Duskfall.game.systems.save.load())">Continue</button>`:''}<button class="big-btn secondary" onclick="Duskfall.game.systems.save.delete();Duskfall.game.ui.renderMenu()">Delete Save</button></div></div>`;
  };
  D.UI.prototype.renderPauseMenu=function(){
    const g=this.game, binds=g.settings.keybinds;
    const actions=[['inventory','Inventory'],['skills','Skills'],['crafting','Crafting'],['quests','Quests'],['bank','Bank'],['map','Map'],['interact','Interact / Use'],['attack','Keyboard Attack'],['buildToggle','Build Mode'],['buildCycle','Cycle Build Tile'],['zoomIn','Zoom In'],['zoomOut','Zoom Out'],['cameraToggle','Toggle Camera'],['cameraOverhead','Overhead Reset'],['rotateLeft','Rotate Left'],['rotateRight','Rotate Right'],['save','Save'],['pause','Pause']];
    document.getElementById('menu').innerHTML=`<div class="menu-card"><h1>Paused</h1><p>Settings, controls, camera, survival toggles, and sandbox building. Combat: LMB attack/heavy, RMB block. Build Mode: LMB place, RMB remove.</p><div class="menu-actions"><button class="big-btn" onclick="Duskfall.game.ui.toggleMenu()">Resume</button><button class="big-btn secondary" onclick="Duskfall.game.systems.save.save()">Save Game</button><button class="big-btn secondary" onclick="Duskfall.game.camera.toggleMode();Duskfall.game.ui.renderMenu()">Camera: ${g.camera.modeLabel()}</button><button class="big-btn secondary" onclick="Duskfall.game.camera.setOverhead();Duskfall.game.ui.renderMenu()">Overhead Reset</button><button class="big-btn secondary" onclick="Duskfall.game.settings.hungerEnabled=!Duskfall.game.settings.hungerEnabled;Duskfall.game.ui.renderMenu()">Hunger: ${g.settings.hungerEnabled?'On':'Off'}</button><button class="big-btn secondary" onclick="Duskfall.game.systems.build.toggle();Duskfall.game.ui.renderMenu()">Build Mode: ${g.buildMode?'On':'Off'}</button></div><div class="setting-grid"><div class="setting-card"><h3>Camera</h3><p>Use mouse wheel or keybinds. Current zoom: ${Math.round(g.camera.targetZoom*100)}%. Current view: ${g.camera.modeLabel()}.</p><button class="small-btn" onclick="Duskfall.game.camera.setZoom(.12);Duskfall.game.ui.renderMenu()">Zoom In</button> <button class="small-btn" onclick="Duskfall.game.camera.setZoom(-.12);Duskfall.game.ui.renderMenu()">Zoom Out</button> <button class="small-btn" onclick="Duskfall.game.camera.rotate(-Math.PI/12);Duskfall.game.ui.renderMenu()">Rotate Left</button> <button class="small-btn" onclick="Duskfall.game.camera.rotate(Math.PI/12);Duskfall.game.ui.renderMenu()">Rotate Right</button> <button class="small-btn" onclick="Duskfall.game.camera.setOverhead();Duskfall.game.ui.renderMenu()">Overhead</button></div><div class="setting-card"><h3>Combat + Build</h3><p>LMB press = regular attack. Hold/release = heavy attack. RMB hold = block. In Build Mode, LMB places and RMB removes. Current build tile: <b>${D.TILES[g.systems.build.selected()].name}</b>.</p><p>${g.input.waitingForBind?'Press a key for: <b>'+g.input.waitingForBind+'</b>':'Keybinds ready.'}</p></div>${actions.map(([a,label])=>`<div class="setting-card"><h3>${label}</h3><button class="small-btn rebind-btn" onclick="Duskfall.game.input.startRebind('${a}')"><span>Current</span><b>${D.displayKey(binds[a])}</b></button></div>`).join('')}</div></div>`;
  };
})();
</script>

<!-- Boot -->
<script>
/* === main.js === */
window.addEventListener('DOMContentLoaded',()=>{
  const D = window.Duskfall = window.Duskfall || {};
  D.runSmokeTests = function(){
    const testWorld = D.generateWorld(12345);
    console.assert(testWorld && testWorld.tiles && testWorld.tiles.length === D.WORLD.h, 'Smoke test failed: world generation did not create tiles.');
    const cx=Math.floor(D.WORLD.w/2), cy=Math.floor(D.WORLD.h/2);
    console.assert(['plaza','stonepath'].includes(testWorld.tiles[cy][cx]), 'Smoke test failed: town center was not generated correctly.');
    console.assert(typeof D.CombatSystem === 'function', 'Smoke test failed: combat system missing.');
    console.assert(D.ENEMIES.rat.attack<=2 && D.ENEMIES.goblin.attack<=4, 'Smoke test failed: early mob balance too strong.');
    console.assert(typeof D.Camera === 'function', 'Smoke test failed: camera system missing.');
    console.assert(typeof D.Camera.prototype.setOverhead === 'function', 'Smoke test failed: overhead camera control missing.');
    console.assert(typeof D.Camera.prototype.rotate === 'function', 'Smoke test failed: camera rotate control missing.');
    const camSmoke={viewW:1280,viewH:720,settings:{cameraMode:'iso'},ui:{toast(){}}};
    const cam=new D.Camera(camSmoke);
    console.assert(cam.targetAngle===0, 'Smoke test failed: default camera should not start sideways.');
    cam.rotate(Math.PI/12);
    console.assert(typeof cam.targetAngle==='number' && typeof cam.targetPitch==='number', 'Smoke test failed: smooth camera targets missing.');
    console.assert(typeof D.BuildSystem === 'function', 'Smoke test failed: build system missing.');
    console.assert(typeof D.GatheringSystem === 'function', 'Smoke test failed: gathering system missing.');
    console.assert(D.RESOURCE_TYPES.pine && D.RESOURCE_TYPES.yew && D.RESOURCE_TYPES.copper && D.RESOURCE_TYPES.gold && D.RESOURCE_TYPES.fish && D.RESOURCE_TYPES.gem, 'Smoke test failed: tier resource foundation missing.');
    console.assert(typeof D.UI.prototype.syncLayoutState === 'function', 'Smoke test failed: UI layout state manager missing.');
    const tmpGame={buildMode:false,ui:{toast(){},log(){},floatText(){}},input:{mouse:{}},systems:{inventory:{canAfford(){return true},take(){return true}}},player:{x:D.WORLD.pxW/2,y:D.WORLD.pxH/2,blocking:false},entities:{npcs:[],enemies:[]},world:testWorld};
    const build=new D.BuildSystem(tmpGame);
    console.assert(build.selected()==='woodfloor', 'Smoke test failed: default build tile incorrect.');
    console.assert(D.CLASSES.melee && D.CLASSES.range && D.CLASSES.mage, 'Smoke test failed: core combat classes missing.');
    console.assert(D.getClassFactions('melee').length===2, 'Smoke test failed: class faction choices missing.');
    console.assert(D.ITEMS.training_bow && D.ITEMS.oak_staff && D.ITEMS.bronze_helm, 'Smoke test failed: expanded class gear missing.');
    const combatSmoke=new D.CombatSystem({input:{mouse:{worldX:0,worldY:0}}});
    console.assert(typeof combatSmoke.rollBonusHit === 'function' && typeof combatSmoke.weaponStyle === 'function', 'Smoke test failed: crit/headshot combat helpers missing.');
    console.assert(combatSmoke.heavyThreshold >= .7, 'Smoke test failed: heavy attack threshold too low.');
    console.assert(D.getRecipe('training_bow') && D.getRecipe('leather_hood') && D.getRecipe('ranger_tunic'), 'Smoke test failed: craftable starter gear missing.');
  };
  D.runSmokeTests();
  console.assert(typeof D.createPlayer === 'function', 'Smoke test failed: player factory missing.');
  const smokeGame={
    input:{axis(){return{x:0,y:0}},mouse:{}},
    world:D.generateWorld(777),
    systems:{inventory:{add(){return true}},perks:{reapply(){}}},
    ui:{toast(){},log(){},floatText(){}},
    camera:{snapTo(){}},
    entities:{drops:[]},
    stats:{deaths:0},settings:{hungerEnabled:false}
  };
  const smokePlayer=D.createPlayer(smokeGame,'melee','ironbound');
  console.assert(smokePlayer && smokePlayer.equipment.head === 'bronze_helm', 'Smoke test failed: class/faction player creation failed.');
  console.assert(smokePlayer.factionName === D.FACTIONS.ironbound.name, 'Smoke test failed: faction assignment failed.');
  D.game = new D.Game();
  D.game.init();
});
</script>
