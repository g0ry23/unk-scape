<!DOCTYPE html>
<html lang="en">
<head>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>UNKSCAPE — Hearthvale Alpha</title>
<link rel="stylesheet" href="css/theme.css">
</head>
<body>

<!-- ======================= 3D WORLD ======================= -->
<canvas id="world-canvas"></canvas>

<!-- ======================= HUD ======================= -->
<div id="hud">

  <!-- TOP CENTER BANNER -->
  <div id="banner" class="panel" style="position:absolute;top:12px;left:50%;transform:translateX(-50%);min-width:360px;">
    <div class="panel-b" style="display:flex;align-items:center;gap:16px;padding:8px 18px;">
      <div style="font-size:18px;letter-spacing:.22em;color:var(--h-gold);text-shadow:var(--h-glow-gold);font-weight:bold;">UNKSCAPE</div>
      <div style="width:1px;height:22px;background:var(--h-border);"></div>
      <div style="text-align:center;line-height:1.25;">
        <div id="zone-name" style="font-size:12px;letter-spacing:.1em;">Oathstead</div>
        <div id="day-time" class="muted" style="font-size:10px;letter-spacing:.08em;">Day 1 · Dusk</div>
      </div>
    </div>
  </div>

  <!-- LEFT: VITALS -->
  <div id="vitals" class="panel" style="position:absolute;top:12px;left:12px;width:248px;">
    <div class="panel-h"><span class="dot"></span> Vitals</div>
    <div class="panel-b">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px;">
        <span id="pname" style="font-size:14px;color:var(--h-text);letter-spacing:.05em;">Wanderer</span>
        <span id="ptotal" class="muted" style="font-size:10px;">Total 15</span>
      </div>
      <div id="prace" class="muted" style="font-size:10px;letter-spacing:.08em;margin-bottom:8px;">Human · Blood Oath</div>
      <div class="stat-row"><span class="lbl">Health</span><div class="vbar hp"><i style="width:100%"></i><span class="vtext" id="hp-text">50 / 50</span></div></div>
      <div class="stat-row"><span class="lbl">Stamina</span><div class="vbar stam"><i style="width:100%"></i><span class="vtext" id="stam-text">100</span></div></div>
      <div class="stat-row"><span class="lbl">Hunger</span><div class="vbar hunger"><i style="width:78%"></i><span class="vtext" id="hunger-text">78</span></div></div>
    </div>
  </div>

  <!-- LEFT: INVENTORY / SKILLS / EQUIP -->
  <div id="inv-panel" class="panel" style="position:absolute;top:212px;left:12px;width:248px;">
    <div class="tabs" id="inv-tabs">
      <div class="tab active" data-itab="inv">Inv</div>
      <div class="tab" data-itab="skills">Skills</div>
      <div class="tab" data-itab="equip">Equip</div>
    </div>
    <div class="panel-b" id="inv-body" style="padding:9px;"></div>
  </div>

  <!-- RIGHT: RADAR / MINIMAP -->
  <div id="radar" class="panel" style="position:absolute;top:12px;right:12px;width:236px;">
    <div class="panel-h"><span class="dot"></span> Radar <span id="compass" class="muted" style="margin-left:auto;font-size:10px;">N</span></div>
    <div class="panel-b" style="padding:9px;">
      <canvas id="minimap" width="216" height="180" style="width:100%;border-radius:6px;border:1px solid var(--h-slot-border);display:block;"></canvas>
      <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:10px;" class="muted">
        <span id="mm-zone">Hearthvale Fields</span><span id="mm-coord">0, 120</span>
      </div>
    </div>
  </div>

  <!-- RIGHT: CHAT / SYSTEM READOUT -->
  <div id="chat-panel" class="panel" style="position:absolute;top:262px;right:12px;width:236px;height:300px;display:flex;flex-direction:column;">
    <div class="tabs" id="chat-tabs">
      <div class="tab active" data-ctab="all">All</div>
      <div class="tab" data-ctab="game">Game</div>
      <div class="tab" data-ctab="trade">Trade</div>
    </div>
    <div id="chat-log" style="flex:1;overflow:auto;padding:8px 10px;font-size:11px;line-height:1.5;"></div>
    <div style="display:flex;gap:6px;padding:7px;border-top:1px solid var(--h-border);">
      <input id="chat-input" placeholder="Say something…" style="flex:1;background:var(--h-well);border:1px solid var(--h-slot-border);border-radius:5px;color:var(--h-text);font-family:var(--h-font);font-size:11px;padding:5px 8px;outline:none;">
    </div>
  </div>

  <!-- RIGHT: QUEST TRACKER (on-HUD, WoW-style) -->
  <div id="quest-tracker" class="panel collapsed" title="Open the Field Log (V)" style="position:absolute;top:574px;right:12px;width:236px;"></div>

  <!-- BOTTOM CENTER: COMBAT STRIP + ACTION BAR -->
  <div style="position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;">
    <div class="strip panel" id="combat-strip" style="display:flex;gap:0;align-items:stretch;overflow:hidden;">
      <div class="cs-cell" data-cs="atk"><span class="cs-l">ATK</span><span class="cs-v" id="cs-atk">1</span></div>
      <div class="cs-cell" data-cs="def"><span class="cs-l">DEF</span><span class="cs-v" id="cs-def">1</span></div>
      <div class="cs-cell" data-cs="build"><span class="cs-l">BUILD</span><span class="cs-v" id="cs-build">1</span></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <button class="dock-arrow" id="dock-inv" title="Toggle inventory ( [ )">◄</button>
      <div id="action-bar" class="panel" style="display:flex;gap:6px;padding:8px;"></div>
      <button class="dock-arrow" id="dock-chat" title="Toggle chat ( ] )">►</button>
    </div>
  </div>

</div>

<!-- floating layers -->
<div id="tooltip"></div>
<div id="toasts"></div>
<div id="modal-scrim"><div id="modal-host"></div></div>

<!-- bundler splash -->
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#161024"/>
    <circle cx="50" cy="50" r="30" fill="none" stroke="#d4a84b" stroke-width="3"/>
    <path d="M38 30 L62 30 L55 50 L62 70 L38 70 L45 50 Z" fill="#c84b20"/>
    <text x="50" y="92" text-anchor="middle" fill="#d4a84b" font-family="monospace" font-size="11">UNKSCAPE</text>
  </svg>
</template>

<!-- combat strip styling (kept inline so it travels with the strip) -->
<style>
  #combat-strip .cs-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px 16px;border-right:1px solid var(--h-border);}
  #combat-strip .cs-cell:last-child{border-right:none;}
  #combat-strip .cs-l{font-size:8px;letter-spacing:.16em;color:var(--h-muted);}
  #combat-strip .cs-v{font-size:15px;color:var(--h-gold);font-weight:bold;}
  #action-bar .aslot{width:46px;height:46px;}
  #action-bar .aslot .hk{position:absolute;left:3px;top:1px;font-size:9px;color:var(--h-muted);}
  #action-bar .aslot.sel{border-color:var(--h-gold);box-shadow:var(--h-glow-gold);}
  .chat-line{margin-bottom:3px;}
  .chat-line .tag{color:var(--h-muted);}
  .chat-line.sys{color:var(--h-muted);font-style:italic;}
  .chat-line .xp{color:var(--h-xp);}
  .chat-line .gain{color:var(--h-gold);}
</style>

<!-- ======================= ENGINE + SCRIPTS ======================= -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/config.js"></script>
<script src="js/data-world.js"></script>
<script src="js/data-quests.js"></script>
<script src="js/state.js"></script>
<script src="js/skills.js"></script>
<script src="js/quests.js"></script>
<script src="js/audio.js"></script>
<script src="js/engine.js"></script>
<script src="js/world.js"></script>
<script src="js/player.js"></script>
<script src="js/gather.js"></script>
<script src="js/ui.js"></script>
<script src="js/ui-modals.js"></script>
<script src="js/input.js"></script>
<script src="js/main.js"></script>

</body>
</html>
