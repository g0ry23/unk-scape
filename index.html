<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNK-SCAPE — Survival RPG</title>
  <link rel="stylesheet" href="client/styles/main.css">
</head>
<body>
  <!-- Game canvas and UI root -->
  <canvas id="game"></canvas>
  <div id="ui-root"></div>
  <div id="hud"></div>
  <div id="panel"></div>
  <div id="dialog"></div>
  <div id="menu" class="hidden"></div>
  <div id="toast-container"></div>
  <div id="action-hint"></div>
  <div id="log-box"></div>
  <canvas id="minimap" width="164" height="164" style="display:none"></canvas>
  <div id="hotbar"></div>
  <div id="combat-ui"></div>
  <div id="float-texts"></div>

  <!-- Config -->
  <script src="client/config/classes.js"></script>
  <script src="client/config/enemies.js"></script>
  <script src="client/config/equipment.js"></script>
  <script src="client/config/items.js"></script>
  <script src="client/config/npcs.js"></script>
  <script src="client/config/perks.js"></script>
  <script src="client/config/prices.js"></script>
  <script src="client/config/quests.js"></script>
  <script src="client/config/recipes.js"></script>
  <script src="client/config/skills.js"></script>
  <script src="client/config/tiles.js"></script>
  <script src="client/config/worldbosses.js"></script>

  <!-- Engine -->
  <script src="client/engine/camera.js"></script>
  <script src="client/engine/input.js"></script>
  <script src="client/engine/render.js"></script>
  <script src="client/engine/game.js"></script>

  <!-- Entities -->
  <script src="client/entities/resource.js"></script>
  <script src="client/entities/projectile.js"></script>
  <script src="client/entities/enemy.js"></script>
  <script src="client/entities/npc.js"></script>
  <script src="client/entities/portal.js"></script>
  <script src="client/entities/player.js"></script>

  <!-- Systems -->
  <script src="client/systems/worldgen.js"></script>
  <script src="client/systems/inventory.js"></script>
  <script src="client/systems/skills.js"></script>
  <script src="client/systems/perks.js"></script>
  <script src="client/systems/quests.js"></script>
  <script src="client/systems/combat.js"></script>

  <script src="client/systems/survival.js"></script>
  <script src="client/systems/crafting.js"></script>
  <script src="client/systems/economy.js"></script>
  <script src="client/systems/bank.js"></script>
  <script src="client/systems/gathering.js"></script>
  <script src="client/systems/build.js"></script>
  <script src="client/systems/dungeon.js"></script>
  <script src="client/systems/turf.js"></script>
  <script src="client/systems/loot.js"></script>
  <script src="client/systems/save.js"></script>

  <script src="client/ui/ui.js"></script>
  <script src="client/ui/hud.js"></script>
  <script src="client/ui/panels.js"></script>
  <script src="client/ui/dialogs.js"></script>
  <script src="client/ui/toasts.js"></script>
  <script src="client/ui/log.js"></script>
  <script src="client/ui/menu.js"></script>

  <!-- Boot -->
  <script src="client/main.js"></script>

</html>
