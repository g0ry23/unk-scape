<script>
/* === systems/worldgen.js === */
(function(){
  const D = window.Duskfall = window.Duskfall || {};
  D.generateWorld=function(seed){
    const rand=D.rand(seed), w=D.WORLD.w,h=D.WORLD.h;
    const tiles=[],noise=[];
    for(let y=0;y<h;y++){
      tiles[y]=[];noise[y]=[];
      for(let x=0;x<w;x++){
        const n=fbm(x*.052,y*.052,rand)+fbm(x*.014+40,y*.014-22,rand)*.55;
        noise[y][x]=(n+1)/2;
        let id='grass';
        const dx=x-w/2,dy=y-h/2,d=Math.hypot(dx,dy)/(w*.62);
        if(noise[y][x]<.22) id='water';
        else if(noise[y][x]<.29) id='sand';
        else if(noise[y][x]>.78) id='stone';
        else if(noise[y][x]>.64) id='darkgrass';
        else if(noise[y][x]<.36) id='swamp';
        if(d>1.05) id='water';
        tiles[y][x]=id;
      }
    }
    const cx=Math.floor(w/2),cy=Math.floor(h/2);
    applyStarterZones(tiles,noise,w,h);
    connectWorldRoads(tiles,w,h);
    // upgraded central town: plaza, roads, fenced boundary, buildings, and farmland
    for(let y=cy-10;y<=cy+10;y++)for(let x=cx-12;x<=cx+12;x++) if(inBounds(x,y,w,h)) tiles[y][x]='dirt';
    for(let y=cy-4;y<=cy+4;y++)for(let x=cx-5;x<=cx+5;x++) if(inBounds(x,y,w,h)) tiles[y][x]='plaza';
    for(let x=0;x<w;x++) if(inBounds(x,cy,w,h) && tiles[cy][x]!=='water') tiles[cy][x]='stonepath';
    for(let y=0;y<h;y++) if(inBounds(cx,y,w,h) && tiles[y][cx]!=='water') tiles[y][cx]='stonepath';
    for(let x=cx-14;x<=cx+14;x++){ if(inBounds(x,cy-12,w,h)) tiles[cy-12][x]='fence'; if(inBounds(x,cy+12,w,h)) tiles[cy+12][x]='fence'; }
    for(let y=cy-12;y<=cy+12;y++){ if(inBounds(cx-14,y,w,h)) tiles[y][cx-14]='fence'; if(inBounds(cx+14,y,w,h)) tiles[y][cx+14]='fence'; }
    tiles[cy][cx-14]='stonepath';tiles[cy][cx+14]='stonepath';tiles[cy-12][cx]='stonepath';tiles[cy+12][cx]='stonepath';
    rect(tiles,cx-10,cy-8,5,4,'woodfloor');rect(tiles,cx-10,cy-9,5,1,'roof');
    rect(tiles,cx+6,cy-8,5,4,'woodfloor');rect(tiles,cx+6,cy-9,5,1,'roof');
    rect(tiles,cx-10,cy+5,5,4,'woodfloor');rect(tiles,cx-10,cy+4,5,1,'roof');
    rect(tiles,cx+6,cy+5,5,4,'woodfloor');rect(tiles,cx+6,cy+4,5,1,'roof');
    rect(tiles,cx-18,cy-7,3,7,'farmland');rect(tiles,cx+16,cy+2,4,7,'farmland');
    return {seed,w,h,tiles,noise};
  };

  function applyStarterZones(tiles,noise,w,h){
    Object.entries(D.STARTER_ZONES||{}).forEach(([id,z])=>{
      for(let yy=z.y-z.r-8;yy<=z.y+z.r+8;yy++)for(let xx=z.x-z.r-8;xx<=z.x+z.r+8;xx++){
        if(!inBounds(xx,yy,w,h))continue;
        const d=Math.hypot(xx-z.x,yy-z.y);
        if(d<=z.r+7){
          let tile=z.biome||'grass';
          const ring=Math.sin((xx+yy)*.23)+Math.cos((xx-z.x)*.18)*.7;
          if(d<5) tile=z.accent||'plaza';
          else if(d<11) tile=(z.road||'path');
          else if(d>z.r-4 && ring>.45) tile='stonepath';
          else if(id==='cleric' && (d>z.r-6 || noise[yy]?.[xx]<.42)) tile='sand';
          else if(id==='prospector' && noise[yy]?.[xx]>.42) tile='stone';
          else if(id==='mage' && noise[yy]?.[xx]>.38) tile='stone';
          else if(id==='brawler' && noise[yy]?.[xx]<.58) tile='dirt';
          else if(id==='gatherer' && noise[yy]?.[xx]>.48) tile='darkgrass';
          else if(id==='range' && noise[yy]?.[xx]>.46) tile='darkgrass';
          else if(id==='warden' && noise[yy]?.[xx]>.40) tile='darkgrass';
          tiles[yy][xx]=tile;
        }
      }
      paintZoneElevationLayers(tiles,noise,id,z,w,h);
      // class camp footprint
      rect(tiles,z.x-3,z.y-3,7,7,z.accent||'plaza');
      rect(tiles,z.x-6,z.y,13,1,z.road||'path');
      rect(tiles,z.x,z.y-6,1,13,z.road||'path');
      rect(tiles,z.x-5,z.y-7,4,3,'woodfloor');
      rect(tiles,z.x+2,z.y+5,4,3,'woodfloor');
      paintFactionSubcamps(tiles,id,z,w,h);
      paintBossArena(tiles,id,z,w,h);
      if(inBounds(z.x,z.y,w,h))tiles[z.y][z.x]=z.accent||'plaza';
    });
  }

  function paintZoneElevationLayers(tiles,noise,id,z,w,h){
    const rings=[z.r*.38,z.r*.62,z.r*.84];
    rings.forEach((rr,idx)=>{
      for(let a=0;a<Math.PI*2;a+=Math.PI/(28+idx*8)){
        const wobble=Math.sin(a*3+idx)*3;
        const x=Math.round(z.x+Math.cos(a)*(rr+wobble));
        const y=Math.round(z.y+Math.sin(a)*(rr+wobble));
        for(let yy=y-1;yy<=y+1;yy++)for(let xx=x-1;xx<=x+1;xx++){
          if(!inBounds(xx,yy,w,h))continue;
          if(tiles[yy][xx]==='water')tiles[yy][xx]='sand';
          else if(['prospector','mage','melee'].includes(id))tiles[yy][xx]='stonepath';
          else if(['range','gatherer','warden'].includes(id))tiles[yy][xx]=idx===0?'path':'darkgrass';
          else tiles[yy][xx]=idx===0?'path':'dirt';
        }
      }
    });
    const landmarks=[[-Math.round(z.r*.55),0],[Math.round(z.r*.55),0],[0,-Math.round(z.r*.55)],[0,Math.round(z.r*.55)]];
    landmarks.forEach((off,i)=>{
      const lx=z.x+off[0], ly=z.y+off[1];
      const tile=['prospector','mage','melee'].includes(id)?'stone':['range','gatherer','warden'].includes(id)?'darkgrass':'dirt';
      for(let yy=ly-3;yy<=ly+3;yy++)for(let xx=lx-3;xx<=lx+3;xx++){
        if(!inBounds(xx,yy,w,h))continue;
        if(Math.hypot(xx-lx,yy-ly)<3.4)tiles[yy][xx]=tile;
      }
    });
  }

  function paintFactionSubcamps(tiles,id,z,w,h){
    const fids=D.getClassFactions(id)||[];
    const offsets=[[-9,-9],[9,9]];
    fids.forEach((fid,i)=>{
      const ox=offsets[i][0], oy=offsets[i][1];
      const baseX=z.x+ox, baseY=z.y+oy;
      rect(tiles,baseX-3,baseY-2,6,4,'woodfloor');
      rect(tiles,baseX-4,baseY,9,1,z.road||'path');
      rect(tiles,baseX,baseY-4,1,8,z.road||'path');
      if(inBounds(baseX+Math.sign(ox)*3,baseY,w,h))tiles[baseY][baseX+Math.sign(ox)*3]='fence';
      roadLine(tiles,z.x,z.y,baseX,baseY,z.road||'path',1);
    });
  }

  function paintBossArena(tiles,id,z,w,h){
    const angleMap={melee:-2.35,warden:-1.55,range:-.78,cleric:0,gatherer:.78,mage:1.55,brawler:2.35,prospector:3.14,wanderer:.35};
    const a=angleMap[id]??0;
    const ax=Math.round(z.x+Math.cos(a)*(z.r+9));
    const ay=Math.round(z.y+Math.sin(a)*(z.r+9));
    for(let yy=ay-5;yy<=ay+5;yy++)for(let xx=ax-5;xx<=ax+5;xx++){
      if(!inBounds(xx,yy,w,h))continue;
      const d=Math.hypot(xx-ax,yy-ay);
      if(d<4.8)tiles[yy][xx]=z.accent||'plaza';
      if(d>4.1&&d<5.4)tiles[yy][xx]='stonepath';
    }
    roadLine(tiles,z.x,z.y,ax,ay,z.road||'path',1);
  }

  function connectWorldRoads(tiles,w,h){
    const zones=D.STARTER_ZONES||{}, hub=zones.wanderer||{x:Math.floor(w/2),y:Math.floor(h/2)};
    Object.entries(zones).forEach(([id,z])=>{
      if(id==='wanderer')return;
      roadLine(tiles,z.x,z.y,hub.x,hub.y,z.road||'path',2);
    });
    const ring=['melee','warden','range','cleric','gatherer','mage','brawler','prospector','melee'];
    for(let i=0;i<ring.length-1;i++){
      const a=zones[ring[i]],b=zones[ring[i+1]];
      if(a&&b) roadLine(tiles,a.x,a.y,b.x,b.y,'path',1);
    }
  }

  function roadLine(tiles,x0,y0,x1,y1,id='path',width=1){
    const steps=Math.max(Math.abs(x1-x0),Math.abs(y1-y0));
    for(let i=0;i<=steps;i++){
      const t=i/Math.max(1,steps);
      const bend=Math.sin(t*Math.PI)*5;
      const x=Math.round(D.lerp(x0,x1,t)+bend*Math.sign(y1-y0||1)*.22);
      const y=Math.round(D.lerp(y0,y1,t)+bend*Math.sign(x0-x1||1)*.22);
      for(let yy=y-width;yy<=y+width;yy++)for(let xx=x-width;xx<=x+width;xx++){
        if(!tiles[yy]?.[xx])continue;
        if(tiles[yy][xx]==='water')tiles[yy][xx]='sand';
        else tiles[yy][xx]=id;
      }
    }
  }
  function fbm(x,y,rand){
    // deterministic-ish smooth value noise via sin hashing
    let v=0,a=.5,f=1;
    for(let i=0;i<4;i++){v+=a*valueNoise(x*f,y*f);f*=2;a*=.5;}
    return v;
  }
  function hash(x,y){let n=Math.sin(x*127.1+y*311.7)*43758.5453123;return n-Math.floor(n)}
  function smooth(t){return t*t*(3-2*t)}
  function valueNoise(x,y){
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);
    const u=smooth(xf),v=smooth(yf);
    return D.lerp(D.lerp(a,b,u),D.lerp(c,d,u),v)*2-1;
  }
  function inBounds(x,y,w,h){return x>=0&&y>=0&&x<w&&y<h}
  function rect(tiles,x,y,w,h,id){for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)if(tiles[yy]?.[xx])tiles[yy][xx]=id}

  D.populateWorld=function(game){
    const rand=D.rand(game.seed+33), w=D.WORLD.w,h=D.WORLD.h,t=D.TILE;
    const cx=Math.floor(w/2),cy=Math.floor(h/2);
    // resources
    for(let y=2;y<h-2;y++) for(let x=2;x<w-2;x++){
      const tile=game.world.tiles[y][x], n=game.world.noise[y][x], nearTown=Math.hypot(x-cx,y-cy)<12;
      if(nearTown||D.TILES[tile].solid) continue;
      let type=null;
      const r=rand();
      if((tile==='grass'||tile==='darkgrass') && n>.50 && r<.050) type='tree';
      else if((tile==='darkgrass'||tile==='grass') && n>.66 && r<.018) type='pine';
      else if(tile==='darkgrass' && n>.74 && r<.008) type='yew';
      else if((tile==='stone'||tile==='darkgrass') && n>.70 && r<.028) type='rock';
      else if(tile==='stone' && n>.72 && r<.018) type='copper';
      else if(tile==='stone' && n>.80 && r<.016) type='iron';
      else if(tile==='stone' && n>.84 && r<.010) type='silver';
      else if(tile==='stone' && n>.88 && r<.006) type='gold';
      else if(tile==='stone' && n>.91 && r<.004) type='gem';
      else if(tile==='sand' && n<.45 && r<.025) type='fish';
      else if((tile==='grass'||tile==='swamp') && n<.55 && r<.035) type='berry';
      else if((tile==='swamp'||tile==='darkgrass') && r<.018) type='herb';
      if(type) game.entities.resources.push(D.createResource(type,x*t+t/2,y*t+t/2,`res_${x}_${y}`));
    }
    // Class starter outposts and safe-ish resource rings
    Object.entries(D.STARTER_ZONES||{}).forEach(([id,z])=>{
      const zone=D.getStarterZone(id);
      zone.resourceBias.forEach((type,idx)=>{
        if(!D.RESOURCE_TYPES[type])return;
        const count=idx===0?9:5;
        for(let j=0;j<count;j++){
          const a=(j/count)*Math.PI*2 + idx*.75;
          const rr=(zone.r+8+idx*7+j%3)*t;
          const x=D.clamp(zone.x*t+t/2+Math.cos(a)*rr,D.TILE*3,D.WORLD.pxW-D.TILE*3);
          const y=D.clamp(zone.y*t+t/2+Math.sin(a)*rr,D.TILE*3,D.WORLD.pxH-D.TILE*3);
          const tx=Math.floor(x/t),ty=Math.floor(y/t);
          if(!D.TILES[game.world.tiles[ty]?.[tx]]?.solid) game.entities.resources.push(D.createResource(type,x,y,`starter_${id}_${type}_${j}`));
        }
      });
    });
    // Starter-zone trainers, faction emissaries, and world identity NPCs
    Object.entries(D.STARTER_ZONES||{}).forEach(([id,z])=>{
      const feat=D.getZoneFeature(id), cls=D.CLASSES[id]||{}, wx=z.x*t+t/2, wy=z.y*t+t/2;
      game.entities.npcs.push({uid:D.uid('npc'),kind:'npc',id:`trainer_${id}`,x:wx+2*t,y:wy-2*t,r:22,color:'#6aa7ff',cfg:{name:feat.trainer,icon:feat.trainerIcon,role:`${cls.name||id} Trainer`,lines:[`Welcome to ${z.name}. This is your first real claim on the UNK-SCAPE map.`,`Train here, gather nearby, then follow the roads toward the Central Crossroads.`,`Soon this zone will have class quests, faction turf objectives, and boss unlocks.`]}});
      const fids=D.getClassFactions(id)||[];
      [[-9,-9],[9,9]].forEach((off,i)=>{
        const fid=fids[i], f=D.FACTIONS[fid]; if(!f)return;
        game.entities.npcs.push({uid:D.uid('npc'),kind:'npc',id:`emissary_${id}_${fid}`,x:(z.x+off[0])*t+t/2,y:(z.y+off[1])*t+t/2,r:22,color:f.color||'#f7c65b',cfg:{name:`${f.name} Emissary`,icon:f.icon,role:'Faction Claim Officer',lines:[`${f.name} wants control of ${z.name}.`,f.desc,`Future turf quests will let your faction capture roads, camps, and boss arenas for claim buffs.`]}});
      });
    });
    // NPCs in central town
    game.entities.npcs.push(D.createNPC('elder',(cx-4)*t+t/2,(cy-1)*t+t/2));
    game.entities.npcs.push(D.createNPC('trader',(cx+4)*t+t/2,(cy-1)*t+t/2));
    game.entities.npcs.push(D.createNPC('banker',(cx-4)*t+t/2,(cy+4)*t+t/2));
    game.entities.portals.push(D.createPortal('dungeon',(cx+10)*t+t/2,(cy+9)*t+t/2));
    // Starter training mobs near each zone, then broader world enemies
    Object.entries(D.STARTER_ZONES||{}).forEach(([id,z])=>{
      const feat=D.getZoneFeature(id), type=feat.trainingMob||'rat';
      for(let i=0;i<6;i++){
        const a=(i/3)*Math.PI*2+.45;
        const tx=Math.round(z.x+Math.cos(a)*(z.r+16+(i%2)*7));
        const ty=Math.round(z.y+Math.sin(a)*(z.r+16+(i%2)*7));
        if(game.world.tiles[ty]?.[tx]&&!D.TILES[game.world.tiles[ty][tx]].solid){
          const mob=D.createEnemy(type,tx*t+t/2,ty*t+t/2);
          mob.cfg={...mob.cfg,name:`Training ${mob.cfg.name}`,hp:Math.max(10,Math.floor(mob.cfg.hp*.65)),attack:Math.max(1,Math.floor(mob.cfg.attack*.55)),xp:Math.max(8,Math.floor(mob.cfg.xp*.55)),aggro:95};
          mob.maxHp=mob.cfg.hp;mob.hp=mob.maxHp;game.entities.enemies.push(mob);
        }
      }
    });
    // enemies
    for(let i=0;i<78;i++) spawnRandomEnemy(game, rand, false);
  };

  function spawnRandomEnemy(game, rand, night){
    const table=night?D.SPAWN_TABLES.night:D.SPAWN_TABLES.day;
    const type=D.weightedPick(table), t=D.TILE, cx=D.WORLD.w/2,cy=D.WORLD.h/2;
    for(let tries=0;tries<80;tries++){
      const x=Math.floor(rand()*D.WORLD.w), y=Math.floor(rand()*D.WORLD.h);
      if(Math.hypot(x-cx,y-cy)<18) continue;
      if(Object.values(D.STARTER_ZONES||{}).some(z=>Math.hypot(x-z.x,y-z.y)<13)) continue;
      const tile=game.world.tiles[y][x]; if(D.TILES[tile].solid) continue;
      game.entities.enemies.push(D.createEnemy(type,x*t+t/2,y*t+t/2)); return;
    }
  }
  D.spawnRandomEnemy=spawnRandomEnemy;

  D.tileAt=function(world,x,y){const tx=Math.floor(x/D.TILE),ty=Math.floor(y/D.TILE);return world.tiles[ty]?.[tx]};
  D.solidAt=function(world,x,y,r=0){
    const pts=[[x-r,y-r],[x+r,y-r],[x-r,y+r],[x+r,y+r],[x,y]];
    return pts.some(p=>{const id=D.tileAt(world,p[0],p[1]);return !id||D.TILES[id].solid;});
  };
})();
</script>
<script>
/* === systems/inventory.js === */
(function(){
  const D = window.Duskfall = window.Duskfall || {};
  D.InventorySystem=function(game){this.game=game;this.items={};};
  D.InventorySystem.prototype.add=function(id,qty=1,silent=false){
    const it=D.ITEMS[id]; if(!it) return false;
    this.items[id]=(this.items[id]||0)+qty;
    if(!silent) {this.game.systems.audio?.play('pickup');this.game.ui.floatText(this.game.player?.x||0,this.game.player?.y||0,`+${qty} ${it.name}`,'#63e6a4');this.game.systems.quests?.notify('collect',id,qty);}
    return true;
  };
  D.InventorySystem.prototype.remove=function(id,qty=1){
    if((this.items[id]||0)<qty)return false;
    this.items[id]-=qty;if(this.items[id]<=0)delete this.items[id];return true;
  };
  D.InventorySystem.prototype.count=function(id){return this.items[id]||0};
  D.InventorySystem.prototype.has=function(id,qty=1){return this.count(id)>=qty};
  D.InventorySystem.prototype.canAfford=function(req){return Object.entries(req||{}).every(([id,q])=>this.has(id,q));};
  D.InventorySystem.prototype.take=function(req){if(!this.canAfford(req))return false;Object.entries(req).forEach(([id,q])=>this.remove(id,q));return true;};
  D.InventorySystem.prototype.quickUse=function(id){if(this.has(id))this.use(id);else this.game.ui.toast('Missing item',`You do not have ${D.ITEMS[id]?.name||id}.`,'bad');};
  D.InventorySystem.prototype.useHotbar=function(index){
    const g=this.game, id=g.hotbar?.slots?.[index];
    if(!id){g.ui.toast('Empty Slot',`Hotbar slot ${index+1} is empty.`,'bad');return false;}
    g.hotbar.selected=index;
    if(!this.has(id) && !Object.values(g.player.equipment||{}).includes(id)){
      g.ui.toast('Missing Hotbar Item',`Slot ${index+1}: ${D.ITEMS[id]?.name||id} is not in your backpack.`, 'bad');
      return false;
    }
    const equipped=Object.entries(g.player.equipment||{}).find(([slot,item])=>item===id);
    if(equipped){g.ui.toast('Selected',`${D.ITEMS[id]?.name||id} is already equipped.`, 'good');return true;}
    return this.use(id);
  };
  D.InventorySystem.prototype.use=function(id){
    const it=D.ITEMS[id], p=this.game.player;if(!it||!this.has(id))return false;
    if(it.type==='food'){
      this.remove(id,1);p.hunger=Math.min(p.maxHunger,p.hunger+(it.hunger||0));this.game.ui.floatText(p.x,p.y-20,'+'+(it.hunger||0)+' hunger','#ffcf6e');this.game.ui.log(`Ate ${it.name}.`,'good');return true;
    }
    if(it.type==='consumable'&&it.heal){this.remove(id,1);p.heal(it.heal);this.game.ui.log(`Used ${it.name}.`,'good');return true;}
    if(['weapon','armor','tool'].includes(it.type)){this.equip(id);return true;}
    this.game.ui.toast('Cannot use',`${it.name} is not directly usable.`,'bad');return false;
  };
  D.InventorySystem.prototype.equip=function(id){
    const it=D.ITEMS[id], p=this.game.player;if(!it||!it.slot||!this.has(id))return false;
    const old=p.equipment[it.slot];
    p.equipment[it.slot]=id;
    this.remove(id,1); if(old) this.add(old,1,true);
    this.game.systems.audio?.play('equip');this.game.ui.toast('Equipped',it.name,'good');this.game.ui.renderPanel();return true;
  };
  D.InventorySystem.prototype.unequip=function(slot){
    const p=this.game.player,id=p.equipment[slot];if(!id)return;
    p.equipment[slot]=null;this.add(id,1,true);this.game.ui.renderPanel();
  };
  D.InventorySystem.prototype.toSave=function(){return {...this.items};};
  D.InventorySystem.prototype.fromSave=function(data){this.items={...(data||{})};};
})();
</script>
<script>
/* === systems/skills.js === */
(function(){
  const D = window.Duskfall = window.Duskfall || {};
  D.SkillSystem=function(game){this.game=game;};
  D.SkillSystem.prototype.addXp=function(skill,xp){
    const p=this.game.player,s=p.skills[skill];if(!s)return;
    const old=D.levelForXp(s.xp);s.xp+=xp;const lvl=D.levelForXp(s.xp);s.level=lvl;
    p.characterXp=(p.characterXp||0)+Math.max(1,Math.floor(xp*.35));
    const oldChar=p.characterLevel||1;
    p.characterLevel=D.characterLevelForXp(p.characterXp||0);
    if(p.characterLevel>oldChar){
      const gained=(p.characterLevel-oldChar)*3;
      p.attributePoints=(p.attributePoints||0)+gained;
      this.game.ui.toast('Character Level Up!',`Level ${p.characterLevel}. +${gained} attribute points earned. Open Character Stats with P.`, 'gold');
    }
    this.game.ui.floatText(p.x,p.y-44,`+${xp} ${D.SKILLS[skill].name} XP`,D.SKILLS[skill].color);
    if(lvl>old){this.game.ui.toast('Skill Level Up!',`${D.SKILLS[skill].name} is now level ${lvl}.`,'gold');this.game.systems.perks.checkUnlocks(skill,lvl);}
  };
  D.SkillSystem.prototype.gather=function(res){
    const p=this.game.player,cfg=res.cfg, level=D.levelForXp(p.skills[cfg.skill].xp), tool=p.stats()[cfg.skill]||0;
    if(level<cfg.level){this.game.ui.toast('Level too low',`${cfg.name} requires ${D.SKILLS[cfg.skill].name} level ${cfg.level}.`,'bad');return;}
    const ok=D.rollSkillSuccess(level+tool,cfg.difficulty);
    if(ok){
      let qty=1+(Math.random()<.12+((p.mods.extraGather||0))?1:0);
      qty=Math.min(qty,res.amount);res.amount-=qty;
      this.game.systems.inventory.add(cfg.item,qty);
      this.addXp(cfg.skill,cfg.xp*qty);
      this.game.stats.resourcesGathered+=qty;
      if(res.amount<=0){res.cooldown=cfg.respawn;this.game.ui.log(`${cfg.name} depleted.`, 'gold');}
    }else{this.game.ui.floatText(p.x,p.y-35,'Failed','#9aa8c7');this.addXp(cfg.skill,Math.max(1,Math.floor(cfg.xp*.15)));}
  };
})();
</script>
<script>
/* === systems/perks.js === */
(function(){
  const D = window.Duskfall = window.Duskfall || {};
  D.PerkSystem=function(game){this.game=game;};
  D.PerkSystem.prototype.reapply=function(){
    const p=this.game.player;if(!p)return;p.mods={};
    for(const id of p.perks||[]){D.PERKS[id]?.apply(p);} 
  };
  D.PerkSystem.prototype.unlock=function(id){
    const p=this.game.player;if(!D.PERKS[id]||p.perks.includes(id))return false;
    p.perks.push(id);this.reapply();this.game.ui.toast('Perk Unlocked',`${D.PERKS[id].icon} ${D.PERKS[id].name}`,'gold');return true;
  };
  D.PerkSystem.prototype.checkUnlocks=function(skill,level){
    D.PERK_LEVELS.filter(x=>x.skill===skill&&x.level<=level).forEach(x=>this.unlock(x.perk));
  };
})();
</script>
<script>
/* === systems/quests.js === */
(function(){
  const D = window.Duskfall = window.Duskfall || {};
  D.QuestSystem=function(game){this.game=game;this.active={};this.completed={};};
  D.QuestSystem.prototype.init=function(){
    this.active={};this.completed={};
    Object.keys(D.QUESTS).forEach(id=>this.start(id));
    const story=D.getClassStory?.(this.game.player?.classId);
    if(story?.starterQuest && D.CLASS_QUESTS?.[story.starterQuest]) this.start(story.starterQuest);
  };
  D.QuestSystem.prototype.start=function(id){if(this.active[id]||this.completed[id])return;this.active[id]={progress:{}};};
  D.QuestSystem.prototype.notify=function(type,id,qty=1){
    for(const [qid,st] of Object.entries(this.active)){
      const q=D.QUESTS[qid] || D.CLASS_QUESTS?.[qid];
      if(!q) return;
      q.steps.forEach((step,i)=>{if(step.type===type && (step.id==null||step.id===id)){const k=i;st.progress[k]=(st.progress[k]||0)+qty;}});
      this.check(qid);
    }
  };
  D.QuestSystem.prototype.update=function(){this.checkAll();};
  D.QuestSystem.prototype.checkAll=function(){Object.keys(this.active).forEach(id=>this.check(id));};
  D.QuestSystem.prototype.check=function(id){
    const q=D.QUESTS[id] || D.CLASS_QUESTS?.[id], st=this.active[id]; if(!q||!st)return;
    const done=q.steps.every((s,i)=>(st.progress[i]||0)>=s.qty);
    if(done){this.complete(id);}
  };
  D.QuestSystem.prototype.complete=function(id){
    const q=D.QUESTS[id] || D.CLASS_QUESTS?.[id]; if(!this.active[id]||!q)return;
    delete this.active[id];this.completed[id]=true;
    Object.entries(q.rewards.xp||{}).forEach(([sk,xp])=>this.game.systems.skills.addXp(sk,xp));
    Object.entries(q.rewards.items||{}).forEach(([it,qty])=>this.game.systems.inventory.add(it,qty));

(function(){
  const D = window.Duskfall = window.Duskfall || {};
  D.CombatSystem=function(game){this.game=game;this.heavyThreshold=.72;this.maxCharge=1.25;this.baseCritChance=.08;this.baseCritMult=1.65;this.headshotRadius=20;};
  D.CombatSystem.prototype.weaponStyle=function(player){
    const w=player?.equipment?.weapon;
    return D.EQUIPMENT[w]?.style || D.ITEMS[w]?.combatStyle || 'melee';
  };
  D.CombatSystem.prototype.rollBonusHit=function(player,enemy,heavy=false){
    const g=this.game, style=this.weaponStyle(player), aimX=g.input.mouse.worldX, aimY=g.input.mouse.worldY;
    const combatLevel=D.levelForXp(player.skills.combat?.xp||0);
    const critChance=this.baseCritChance + Math.min(.12,(combatLevel-1)*.01) + (heavy?.04:0);
    const headDistance=Math.hypot(enemy.x-aimX,enemy.y-14-aimY);
    const canHeadshot=style==='range'||style==='mage';
    const headshot=canHeadshot && headDistance <= this.headshotRadius + (heavy?8:0);
    const crit=Math.random()<critChance;
    let mult=1;
    const tags=[];
    if(crit){mult*=this.baseCritMult;tags.push('CRIT');}
    if(headshot){mult*=style==='mage'?1.75:1.9;tags.push('HEADSHOT');}
    return {crit,headshot,mult,tags,style};
  };
  D.CombatSystem.prototype.releasePrimary=function(held){
    const heavy=held>=this.heavyThreshold;
    this.playerAttack(heavy, Math.min(held,this.maxCharge));
  };
  D.CombatSystem.prototype.playerAttack=function(heavy=false,charge=0){
    const g=this.game,p=g.player;if(!p||p.dead||p.attackCooldown>0||p.blocking)return;
    const stats=p.stats();
    const style=this.weaponStyle(p);
    if(style==='range' && g.systems.inventory.has('arrow',1)){
      g.systems.inventory.remove('arrow',1);
    }
    const chargeBonus=D.clamp(charge/this.maxCharge,0,1);
    const cooldown=heavy?stats.attackSpeed*1.55:stats.attackSpeed;
    const range=style==='melee' ? stats.range+(heavy?22:0) : stats.range+(heavy?55:0);
    const accuracy=D.clamp(stats.accuracy-(heavy ? 0.08 : 0),.1,.96);
    const aimX=g.input.mouse.worldX, aimY=g.input.mouse.worldY;
    p.attackCooldown=cooldown;
    p.attackAnim=heavy ? .34 : .22;
    p.attackAnimMax=p.attackAnim;
    p.lastAttackHeavy=heavy;
    p.heavyCharge=0;
    p.heavyCharging=false;
    p.attackAngle=Math.atan2(aimY-p.y,aimX-p.x);
    p.facingAngle=p.attackAngle;

    let targets=g.entities.enemies.filter(e=>!e.dead&&D.dist(p,e)<range+e.r);
    if(style!=='melee'){
      targets=targets.filter(e=>this.isEnemyNearAimLine(p,e,aimX,aimY,range,heavy));
    }
    if(!targets.length){
      g.ui.floatText(p.x,p.y-32,style==='range'?(heavy?'Heavy Shot':'Shot'):style==='mage'?(heavy?'Charged Spell':'Spell'):(heavy?'Heavy Swing':'Swing'),heavy?'#ff5c7a':'#9aa8c7');
      if(style!=='melee') this.spawnAttackProjectile(p,aimX,aimY,0,style,heavy,null,false);
      g.systems.audio?.play('miss');
      return;
    }
    targets.sort((a,b)=>{
      const aLine=this.distanceToAimLine(p,a,aimX,aimY), bLine=this.distanceToAimLine(p,b,aimX,aimY);
      const aAim=Math.hypot(a.x-aimX,a.y-aimY), bAim=Math.hypot(b.x-aimX,b.y-aimY);
      const aPlayer=D.dist(p,a), bPlayer=D.dist(p,b);

    });
    const maxTargets=style==='melee' ? (heavy?Math.min(3,targets.length):1) : 1;
    let fired=false;
    for(const e of targets.slice(0,maxTargets)){
      const hit=Math.random()<accuracy;
      if(style!=='melee' && !fired){this.spawnAttackProjectile(p,e.x,e.y,hit?1:0,style,heavy,e,hit);fired=true;}
      g.systems.audio?.play(heavy?'heavyHit':'hit');
      if(hit){
        e.hitMarker=.2;
        e.hitFlash=.16;
        const lvl=D.levelForXp(p.skills.combat.xp);
        const baseMax=Math.max(3,stats.attack+Math.floor(lvl*.65));
        const styleMult=style==='mage'?1.08:style==='range'?1.0:1;
        const attackMult=(heavy?1.45+chargeBonus*.55:1)*styleMult;
        const bonus=this.rollBonusHit(p,e,heavy);
        const totalMult=attackMult*bonus.mult;
        const min=Math.max(1,Math.floor(baseMax*.42*totalMult));
        const max=Math.max(min,Math.floor(baseMax*totalMult));
        const raw=D.irand(min,max);
        const dmg=Math.max(1,Math.floor(raw-(e.cfg.defense||0)*.25));
        e.takeDamage(dmg,p);
        const verb=style==='range'?(heavy?'POWER SHOT':null):style==='mage'?(heavy?'CHARGED':null):(heavy?'HEAVY':null);
        const labelText=[verb,...bonus.tags,'-'+dmg].filter(Boolean).join(' ');
        const color=bonus.headshot?'#63e6a4':bonus.crit?'#f7c65b':heavy?'#ff5c7a':'#ffcf6e';
        g.ui.floatText(e.x,e.y-28,labelText,color);
        if(bonus.crit||bonus.headshot) g.systems.skills.addXp('combat',1);
        g.camera.bump(bonus.headshot?1.35:heavy?1.05:.45);
        if(e.dead)this.kill(e);
      }else{e.missMarker=.2;g.ui.floatText(e.x,e.y-28,'MISS','#9aa8c7');}
    }
  };
  D.CombatSystem.prototype.distanceToAimLine=function(p,e,aimX,aimY){
    const ax=p.x, ay=p.y, bx=aimX, by=aimY;
    const dx=bx-ax, dy=by-ay, len2=dx*dx+dy*dy;

  };
  D.CombatSystem.prototype.isEnemyNearAimLine=function(p,e,aimX,aimY,range,heavy=false){
    const dist=D.dist(p,e); if(dist>range+e.r)return false;
    const rayLen=Math.hypot(aimX-p.x,aimY-p.y);
    if(rayLen<22)return Math.hypot(e.x-aimX,e.y-aimY)<e.r+34;
    const lineDist=this.distanceToAimLine(p,e,aimX,aimY);
    return lineDist <= e.r + (heavy?28:20);
  };
  D.CombatSystem.prototype.spawnAttackProjectile=function(p,tx,ty,hitPower,style,heavy,target,hit){
    const g=this.game;
    const startX=p.x+Math.cos(p.attackAngle||p.facingAngle||0)*26;
    const startY=p.y+Math.sin(p.attackAngle||p.facingAngle||0)*26;
    const color=style==='mage'?(heavy?'#ff9b5c':'#b98cff'):(heavy?'#ffcf6e':'#dbe4ff');
    const r=style==='mage'?(heavy?8:6):(heavy?5:4);
    const speed=style==='mage'?(heavy?430:390):(heavy?560:500);
    const proj=D.createProjectile(startX,startY,tx,ty,{speed,r,color,life:1.0,damage:hitPower||0,source:'player',recoverable:style==='range',recoverChance:heavy?.82:.68,dropId:'arrow',style});
    proj.visualOnly=true;
    proj.style=style;
    proj.targetId=target?.uid||null;
    proj.onHit=hit;
    g.entities.projectiles.push(proj);
  };
  D.CombatSystem.prototype.enemyAttack=function(e){
    const g=this.game,p=g.player;if(!p||p.dead||e.dead||e.attackTimer>0)return;
    e.attackTimer=e.cfg.attackCooldown;
    const hit=Math.random()<e.cfg.accuracy;
    if(hit)p.takeDamage(D.irand(1,Math.max(1,e.cfg.attack)),e);else g.ui.floatText(p.x,p.y-28,'MISS','#9aa8c7');
  };
  D.CombatSystem.prototype.kill=function(e){
    const g=this.game;
    g.systems.skills.addXp('combat',e.cfg.xp);
    g.stats.kills[e.type]=(g.stats.kills[e.type]||0)+1;
    g.systems.quests.notify('kill',e.type,1);
    g.systems.loot.dropEnemy(e);
    g.ui.log(`Defeated ${e.cfg.name}.`,'good');
    setTimeout(()=>{g.entities.enemies=g.entities.enemies.filter(x=>x!==e);},0);
  };
  D.CombatSystem.prototype.update=function(dt){
    const g=this.game,p=g.player;if(!p)return;
    const held=g.input.mouse.leftHeld||0;
    p.heavyCharging=!!g.input.mouse.leftDown && held>=this.heavyThreshold;
    p.heavyCharge=p.heavyCharging?Math.min(this.maxCharge,held-this.heavyThreshold):0;
    g.entities.enemies.forEach(e=>{
      e.targeted=false;
      e.hitMarker=Math.max(0,(e.hitMarker||0)-dt);
      e.missMarker=Math.max(0,(e.missMarker||0)-dt);
    });
    const aimX=g.input.mouse.worldX, aimY=g.input.mouse.worldY;
    const near=g.entities.enemies.filter(e=>!e.dead&&D.dist(p,e)<150).sort((a,b)=>{
      const aAim=Math.hypot(a.x-aimX,a.y-aimY), bAim=Math.hypot(b.x-aimX,b.y-aimY);
      const aPlayer=D.dist(p,a), bPlayer=D.dist(p,b);
      return (aAim*.8+aPlayer*.2)-(bAim*.8+bPlayer*.2);
    })[0];
    if(near && Math.hypot(near.x-aimX,near.y-aimY)<105) near.targeted=true;
  };

</script>

    this.game=game;
    this.nodes=[];
    this.active=null;
    this.timer=0;
    this.duration=3;
    this.respawnTime=10;
    this.seeded=false;
  };
  D.GatheringSystem.prototype.nodeLabel=function(node){
    if(!node)return 'Gathering';
    if(node.cfg)return `${node.cfg.action||'Gather'}: ${node.cfg.name}`;
    return 'Chop: Harvest Tree';
  };
  D.GatheringSystem.prototype.gatherDuration=function(node){
    if(!node||!node.cfg)return 3;
    const p=this.game.player, lvl=D.levelForXp(p.skills[node.cfg.skill]?.xp||0), tool=p.stats()[node.cfg.skill]||0;
    return D.clamp(3.4 + (node.cfg.tier||1)*.45 - (lvl+tool)*.10,1.3,5.2);
  };
  D.GatheringSystem.prototype.ensureNodes=function(){
    const g=this.game;
    if(this.seeded||!g.world||!g.player)return;
    this.seeded=true;
    const nodes=[];
    const tries=260;
    for(let i=0;i<tries&&nodes.length<3;i++){
      const angle=Math.random()*Math.PI*2;
      const dist=160+Math.random()*360;
      let x=D.clamp(g.player.x+Math.cos(angle)*dist,D.TILE*3,D.WORLD.pxW-D.TILE*3);
      let y=D.clamp(g.player.y+Math.sin(angle)*dist,D.TILE*3,D.WORLD.pxH-D.TILE*3);
      const tx=Math.floor(x/D.TILE),ty=Math.floor(y/D.TILE);
      const tileId=g.world.tiles[ty]?.[tx];
      if(!tileId||D.TILES[tileId]?.solid||tileId==='water')continue;
      if(nodes.some(n=>Math.hypot(n.x-x,n.y-y)<140))continue;
      nodes.push({id:'tree_'+nodes.length,x,y,r:34,active:true,respawn:0,type:'tree'});
    }
    while(nodes.length<3){
      const n=nodes.length;
      nodes.push({id:'tree_'+n,x:g.player.x+(n-1)*120,y:g.player.y+190+n*40,r:34,active:true,respawn:0,type:'tree'});
    }
    this.nodes=nodes;
  };
  D.GatheringSystem.prototype.tryStartAt=function(x,y){
    this.ensureNodes();
    const g=this.game,p=g.player;
    if(!p)return false;
    let node=this.nodes.find(n=>n.active&&Math.hypot(n.x-x,n.y-y)<=n.r+24&&Math.hypot(n.x-p.x,n.y-p.y)<=92);
    if(!node){
      node=g.entities.resources.find(r=>r.amount>0&&Math.hypot(r.x-x,r.y-y)<=r.r+26&&Math.hypot(r.x-p.x,r.y-p.y)<=96);
    }
    if(!node)return false;
    if(node.cfg){
      const level=D.levelForXp(p.skills[node.cfg.skill]?.xp||0);
      if(level<node.cfg.level){g.ui.toast('Level too low',`${node.cfg.name} requires ${D.SKILLS[node.cfg.skill].name} level ${node.cfg.level}.`,'bad');return true;}
    }
    this.active=node;
    this.duration=this.gatherDuration(node);
    this.timer=0;
    if(p){p.gathering=true;p.blocking=false;p.heavyCharging=false;}
    if(g.input?.mouse){g.input.mouse.leftDown=false;g.input.mouse.rightDown=false;}
    g.ui.log(`Started ${this.nodeLabel(node).toLowerCase()}.`,'gold');
    return true;
  };
  D.GatheringSystem.prototype.cancel=function(){
    if(this.game.player)this.game.player.gathering=false;
    this.active=null;
    this.timer=0;
  };
  D.GatheringSystem.prototype.finish=function(){
    const g=this.game,node=this.active;
    if(!node){this.cancel();return;}
    if(node.cfg){
      const p=g.player,cfg=node.cfg;
      const lvl=D.levelForXp(p.skills[cfg.skill]?.xp||0), tool=p.stats()[cfg.skill]||0;
      const ok=D.rollSkillSuccess(lvl+tool,cfg.difficulty);
      if(!ok){
        g.ui.floatText(p.x,p.y-35,'Failed','#9aa8c7');
        if(g.systems.skills) g.systems.skills.addXp(cfg.skill,Math.max(1,Math.floor(cfg.xp*.15)));
        this.cancel();return;
      }
      let qty=1+(Math.random()<.10+(p.mods.extraGather||0)?1:0);
      qty=Math.min(qty,node.amount);
      const item=(cfg.altItem&&Math.random()<(cfg.altChance||0))?cfg.altItem:cfg.item;
      node.amount-=qty;
      g.systems.inventory.add(item,qty);
      g.systems.audio?.play(cfg.skill==='mining'?'mine':'chop');
      if(g.systems.skills) g.systems.skills.addXp(cfg.skill,cfg.xp*qty);
      if(g.systems.quests) g.systems.quests.notify('gather',item,qty);
      g.stats.resourcesGathered+=qty;
      g.ui.floatText(p.x,p.y-42,`+${qty} ${D.ITEMS[item]?.name||item}`,'#38d978');
      if(node.amount<=0){node.cooldown=cfg.respawn;g.ui.log(`${cfg.name} depleted.`, 'gold');}
    }else{
      node.active=false;
      node.respawn=this.respawnTime;
      g.systems.inventory.add('log',1);
      g.systems.audio?.play('chop');
      if(g.systems.skills) g.systems.skills.addXp('woodcutting',12);
      if(g.systems.quests) g.systems.quests.notify('gather','log',1);
      g.ui.floatText(g.player.x,g.player.y-42,'+1 Wood','#38d978');
      g.ui.log('Collected 1 Wood. The tree will regrow soon.','good');
    }
    this.cancel();
  };
  D.GatheringSystem.prototype.update=function(dt){
    this.ensureNodes();
    const g=this.game,p=g.player;
    this.nodes.forEach(n=>{if(!n.active&&n.respawn>0){n.respawn-=dt;if(n.respawn<=0){n.active=true;n.respawn=0;g.ui.log('A harvest tree has regrown.','gold');}}});
    if(!this.active||!p)return;
    if(!this.active.active){this.cancel();return;}
    if(Math.hypot(this.active.x-p.x,this.active.y-p.y)>112){g.ui.log(`You moved too far away and stopped ${this.nodeLabel(this.active).toLowerCase()}.`,'bad');this.cancel();return;}
    this.timer+=dt;
    if(this.timer>=this.duration)this.finish();
  };
})();
</script>
<script>
/* === systems/build.js === */
(function(){
  const D = window.Duskfall = window.Duskfall || {};
  D.BuildSystem=function(game){
    this.game=game;
    this.palette=['woodfloor','fence','stonepath','farmland'];
    this.index=0;
    this.costs={woodfloor:{log:1},fence:{log:2},stonepath:{stone:2},farmland:{stone:1}};
  };
  D.BuildSystem.prototype.selected=function(){return this.palette[this.index]||'woodfloor';};
  D.BuildSystem.prototype.toggle=function(){
    const g=this.game;
    g.buildMode=!g.buildMode;
    if(g.player){g.player.blocking=false;g.input.mouse.rightDown=false;g.input.mouse.leftDown=false;}
    g.ui.toast('Build Mode', g.buildMode?`ON — ${D.TILES[this.selected()].name}. LMB place, RMB remove.`:'OFF — combat controls restored.', g.buildMode?'gold':'good');
  };
  D.BuildSystem.prototype.cycle=function(){
    this.index=(this.index+1)%this.palette.length;
    this.game.ui.toast('Build Tile', D.TILES[this.selected()].name, 'gold');
  };
  D.BuildSystem.prototype.canEdit=function(tx,ty){
    const g=this.game,p=g.player;
    if(!p||tx<0||ty<0||tx>=D.WORLD.w||ty>=D.WORLD.h)return false;
    const wx=tx*D.TILE+D.TILE/2, wy=ty*D.TILE+D.TILE/2;
    if(Math.hypot(wx-p.x,wy-p.y)>165){g.ui.toast('Too Far','Move closer to build there.','bad');return false;}
    if(g.entities.npcs.some(n=>Math.hypot(wx-n.x,wy-n.y)<58)){g.ui.toast('Blocked','You cannot build on town NPCs.','bad');return false;}
    if(g.entities.enemies.some(e=>!e.dead&&Math.hypot(wx-e.x,wy-e.y)<44)){g.ui.toast('Blocked','Clear nearby mobs before building.','bad');return false;}
    return true;
  };
  D.BuildSystem.prototype.placeAt=function(x,y){
    const g=this.game, tx=Math.floor(x/D.TILE), ty=Math.floor(y/D.TILE);
    if(!this.canEdit(tx,ty))return;
    const current=g.world.tiles[ty]?.[tx], tile=this.selected();
    if(!current||['water','wall','roof'].includes(current)){g.ui.toast('Cannot Build','That tile cannot be replaced yet.','bad');return;}
    const cost=this.costs[tile]||{};
    if(!g.systems.inventory.canAfford(cost)){g.ui.toast('Need Materials',Object.entries(cost).map(([id,q])=>`${q} ${D.ITEMS[id].name}`).join(', '),'bad');return;}
    g.systems.inventory.take(cost);
    g.world.tiles[ty][tx]=tile;
    g.ui.floatText(tx*D.TILE+D.TILE/2,ty*D.TILE+D.TILE/2,'BUILD','#f7c65b');
    g.ui.log(`Placed ${D.TILES[tile].name}.`,'gold');
  };
  D.BuildSystem.prototype.removeAt=function(x,y){
    const g=this.game, tx=Math.floor(x/D.TILE), ty=Math.floor(y/D.TILE);
    if(!this.canEdit(tx,ty))return;
    const current=g.world.tiles[ty]?.[tx];
    if(!this.palette.includes(current)){g.ui.toast('Cannot Remove','Only player-built tiles can be removed right now.','bad');return;}
    g.world.tiles[ty][tx]='dirt';
    g.ui.floatText(tx*D.TILE+D.TILE/2,ty*D.TILE+D.TILE/2,'REMOVED','#9aa8c7');
    g.ui.log(`Removed ${D.TILES[current].name}.`,'good');
  };
})();
</script>
<script>
/* === systems/dungeon.js === */
(function(){
  const D = window.Duskfall = window.Duskfall || {};
  D.DungeonSystem=function(game){this.game=game;this.inside=false;this.returnPos=null;};
  D.DungeonSystem.prototype.enter=function(id){
    const g=this.game;if(id!=='dungeon')return;
    if(this.inside){this.exit();return;}
    this.returnPos={x:g.player.x,y:g.player.y};this.inside=true;
    g.ui.toast('Old Catacombs','A compact dungeon prototype begins. Defeat the ambush.','gold');
    g.player.x=D.WORLD.pxW/2;g.player.y=D.WORLD.pxH/2+420;g.camera.snapTo(g.player.x,g.player.y);
    // spawn an encounter around player
    for(let i=0;i<5;i++){const a=i/5*Math.PI*2;g.entities.enemies.push(D.createEnemy(i===4?'lurker':'husk',g.player.x+Math.cos(a)*180,g.player.y+Math.sin(a)*140));}
  };
  D.DungeonSystem.prototype.exit=function(){
    const g=this.game;if(!this.returnPos)return;g.player.x=this.returnPos.x;g.player.y=this.returnPos.y;g.camera.snapTo(g.player.x,g.player.y);this.inside=false;g.ui.toast('Returned','You step back into the overworld.','good');
  };
  D.DungeonSystem.prototype.update=function(){
    if(!this.inside)return;
    const g=this.game,p=g.player;
    if(this.returnPos && Math.hypot(p.x-D.WORLD.pxW/2,p.y-(D.WORLD.pxH/2+420))>520){this.exit();}
  };
})();
</script>
<script>
/* === systems/turf.js === */
(function(){
  const D = window.Duskfall = window.Duskfall || {};
  D.TurfSystem=function(game){this.game=game;this.points=[];this.capture=null;this.seeded=false;this.owner={};};
  D.TurfSystem.prototype.ensure=function(){
    if(this.seeded||!this.game.world)return;this.seeded=true;
    Object.entries(D.STARTER_ZONES||{}).forEach(([classId,z])=>{
      const fids=D.getClassFactions(classId)||[];
      [[-6,-4],[6,4]].forEach((off,i)=>{
        const fid=fids[i]; if(!fid)return;
        this.points.push({id:`${classId}_${fid}_claim`,classId,factionId:fid,x:(z.x+off[0])*D.TILE+D.TILE/2,y:(z.y+off[1])*D.TILE+D.TILE/2,r:78,progress:0,owner:null,name:`${D.FACTIONS[fid].name} Claim Stone`});
      });
    });
  };
  D.TurfSystem.prototype.update=function(dt){
    this.ensure();
    const g=this.game,p=g.player;if(!p||g.paused)return;
    const near=this.points.find(pt=>Math.hypot(pt.x-p.x,pt.y-p.y)<pt.r);
    if(!near){this.capture=null;return;}
    if(near.factionId!==p.factionId){this.capture=null;return;}
    near.progress=D.clamp((near.progress||0)+dt/8,0,1);
    this.capture=near;
    if(near.progress>=1 && near.owner!==p.factionId){
      near.owner=p.factionId;this.owner[near.id]=p.factionId;
      g.ui.toast('Turf Claimed',`${near.name} now belongs to ${p.factionName}. Claim buff foundation active.`, 'gold');
      g.ui.log(`${p.factionName} claimed turf in ${D.CLASSES[near.classId]?.zone||'the wilds'}.`, 'gold');
    }
  };
})();
</script>
<script>

(function(){
  const D = window.Duskfall = window.Duskfall || {};
  D.LootSystem=function(game){this.game=game;};
  D.LootSystem.prototype.drop=function(id,qty,x,y){
    this.game.entities.drops.push({uid:D.uid('drop'),id,qty,x:x+(Math.random()-.5)*24,y:y+(Math.random()-.5)*24,r:10});
  };
  D.LootSystem.prototype.dropEnemy=function(e){
    const p=this.game.player;
    let [min,max]=e.cfg.coins||[0,0];let coins=D.irand(min,max);
    coins=Math.floor(coins*(1+(p.mods.coinBonus||0)));
    if(coins>0)this.drop('coin',coins,e.x,e.y);
    for(const l of e.cfg.loot||[]){if(Math.random()<l.chance)this.drop(l.id,D.irand(l.min,l.max),e.x,e.y);}
  };

<script>
/* === ui/ui.js === */
(function(){
  const D = window.Duskfall = window.Duskfall || {};
  D.UI=function(game){this.game=game;this.panel=null;this.dialogNpc=null;this.toastId=0;};
  D.UI.prototype.closeAll=function(){document.getElementById('panel').classList.remove('show');document.getElementById('dialog').classList.remove('show');document.getElementById('menu').classList.remove('show');this.panel=null;this.dialogNpc=null;if(this.game.state==='play')this.game.paused=false;this.syncLayoutState();this.clearInputLocks();};
  D.UI.prototype.clearInputLocks=function(){const g=this.game;if(!g.input||!g.input.mouse)return;g.input.mouse.leftDown=false;g.input.mouse.rightDown=false;g.input.mouse.leftHeld=0;if(g.player){g.player.blocking=false;g.player.heavyCharging=false;}};
  D.UI.prototype.syncLayoutState=function(){
    const root=document.getElementById('ui-root');
    const panel=document.getElementById('panel').classList.contains('show');
    const dialog=document.getElementById('dialog').classList.contains('show');
    const menu=document.getElementById('menu').classList.contains('show');
    root.classList.toggle('panel-open',panel);
    root.classList.toggle('dialog-open',dialog&&!panel&&!menu);
    root.classList.toggle('menu-open',menu);
  };
  D.UI.prototype.update=function(){this.syncLayoutState();this.renderHUD();this.renderCombatUI();this.renderHotbar();this.renderActionHint();};
  D.UI.prototype.floatText=function(x,y,text,color){if(this.game.settings?.display?.floatingText===false)return;this.game.entities.effects.push({x,y,text,color,t:1,maxT:1,float:55,size:16});};
  D.UI.prototype.applyDisplaySettings=function(){
    const d=this.game.settings.display||{};
    document.documentElement.dataset.uiScale=d.uiScale||'normal';
    document.body.classList.toggle('reduced-fx',!!d.reducedFx);
  };
  D.UI.prototype.renderActionHint=function(){
    const el=document.getElementById('action-hint'), g=this.game, p=g.player;
    if(!el||!p||g.state!=='play'||g.paused){if(el){el.classList.remove('show');el.innerHTML='';}return;}
    const mx=g.input.mouse.worldX,my=g.input.mouse.worldY;
    const screenX=g.input.mouse.x+18, screenY=g.input.mouse.y-18;
    let text='';
    const nearEnemy=g.entities.enemies.filter(e=>!e.dead&&Math.hypot(e.x-mx,e.y-my)<e.r+34&&Math.hypot(e.x-p.x,e.y-p.y)<p.stats().range+140).sort((a,b)=>Math.hypot(a.x-mx,a.y-my)-Math.hypot(b.x-mx,b.y-my))[0];
    const nearNode=(g.systems.gathering?.nodes||[]).find(n=>n.active&&Math.hypot(n.x-mx,n.y-my)<=n.r+24&&Math.hypot(n.x-p.x,n.y-p.y)<=96);
    const nearResource=g.entities.resources.filter(r=>r.amount>0&&Math.hypot(r.x-mx,r.y-my)<=r.r+26&&Math.hypot(r.x-p.x,r.y-p.y)<=96).sort((a,b)=>Math.hypot(a.x-mx,a.y-my)-Math.hypot(b.x-mx,b.y-my))[0];
    const nearNpc=g.entities.npcs.find(n=>Math.hypot(n.x-mx,n.y-my)<34&&Math.hypot(n.x-p.x,n.y-p.y)<80);
    const nearDrop=g.entities.drops.find(d=>Math.hypot(d.x-mx,d.y-my)<32&&Math.hypot(d.x-p.x,d.y-p.y)<55);
    if(g.buildMode){text=`<span class="hint-dot"></span><b>LMB</b> Place • <b>RMB</b> Remove • <b>T</b> Cycle ${D.TILES[g.systems.build.selected()].name}`;}
    else if(nearNpc){text=`<span class="hint-dot"></span><b>F</b> Talk to ${nearNpc.cfg.name}`;}
    else if(nearNode){text=`<span class="hint-dot"></span><b>LMB</b> Chop Harvest Tree`;} 
    else if(nearResource){text=`<span class="hint-dot"></span><b>LMB</b> ${nearResource.cfg.action||'Gather'} ${nearResource.cfg.name}`;}
    else if(nearEnemy){const style=g.systems.combat.weaponStyle(p);text=`<span class="hint-dot"></span><b>LMB</b> ${style==='range'?'Shoot':style==='mage'?'Cast':'Attack'} ${nearEnemy.cfg.name} • <b>Hold</b> Heavy • <b>RMB</b> Block`;}
    else if(nearDrop){text=`<span class="hint-dot"></span>Walk over to pick up ${D.ITEMS[nearDrop.id]?.name||nearDrop.id}`;}
    if(!text){el.classList.remove('show');el.innerHTML='';return;}
    el.innerHTML=text;el.style.left=D.clamp(screenX,120,g.viewW-120)+'px';el.style.top=D.clamp(screenY,60,g.viewH-100)+'px';el.classList.add('show');
  };
})();
</script>
<script>

        <div class="hud-card bars">

          <div class="bar-wrap"><span>Combat</span><div class="bar xp"><i style="width:${D.clamp(xpPct,0,100)}%"></i></div><b>Lv ${combatLvl}</b></div>
        </div>
        <div class="hud-card stat-row">
          <span class="pill gold"><i class="dot"></i>${g.systems.inventory.count('coin')} coins</span>
          <span class="pill green"><i class="dot"></i>Total Lv ${totalLvl}</span>
          <span class="pill purple"><i class="dot"></i>Zoom ${Math.round(g.camera.targetZoom*100)}%</span>
          <span class="pill orange"><i class="dot"></i>Hunger ${g.settings.hungerEnabled?'On':'Off'}</span>
          <span class="pill"><i class="dot"></i>Build ${g.buildMode?'On':'Off'}</span>
          <span class="pill gold" title="Faction choice shows here after character creation"><i class="dot"></i>${D.FACTIONS[p.factionId]?.icon||'⚑'} ${p.factionName||'No Faction'}</span>
          <span class="pill purple" title="Class storyline"><i class="dot"></i>${D.getClassStory(p.classId).title}</span>

        <div class="hud-card minimap"><canvas id="minimap" width="164" height="164"></canvas></div>
      </div>`;

  };
  D.UI.prototype.renderCombatUI=function(){
    const el=document.getElementById('combat-ui'), g=this.game, p=g.player;
    if(!el||!p||g.state==='menu'){if(el)el.innerHTML='';return;}
    const charge=D.clamp((p.heavyCharge||0)/Math.max(.01,(g.systems.combat?.maxCharge||1.25)-(g.systems.combat?.heavyThreshold||.72)),0,1)*100;
    el.innerHTML=`<div class="combat-card">
      <div class="combat-chip ${p.heavyCharging?'active':''}">⚔️ ${g.buildMode?'Place':p.heavyCharging?'Heavy Charging':'Tap Attack'}</div>
      <div class="charge-meter"><i style="width:${charge}%"></i></div>
      <div class="combat-chip ${p.blocking?'blocking':''}">🛡️ ${g.buildMode?'Remove':p.blocking?'Guarding':'Guard'}</div>
      <div class="combat-chip ${g.buildMode?'active':''}">🛠️ Build ${g.buildMode?D.TILES[g.systems.build.selected()].name:'Off'}</div>
    </div>`;
  };
  D.UI.prototype.renderHotbar=function(){
    const el=document.getElementById('hotbar'), g=this.game, p=g.player;
    if(!el||!p||g.state==='menu'){if(el)el.innerHTML='';return;}
    const slots=g.hotbar?.slots||[];
    el.innerHTML=`<div class="hotbar-card">${slots.map((id,i)=>{
      const it=D.ITEMS[id]||{name:id,icon:'❔'};
      const equipped=Object.values(p.equipment||{}).includes(id);
      const qty=g.systems.inventory.count(id)+(equipped?1:0);
      const selected=g.hotbar.selected===i || (equipped && ['weapon','tool'].includes(it.slot||''));
      return `<div class="hotbar-slot ${selected?'selected':''} ${qty<=0?'missing':''}" title="${it.name}"><span class="num">${i+1}</span><span class="ico">${it.icon}</span>${qty>1?`<span class="qty">x${qty}</span>`:''}<span class="name">${it.name}</span></div>`;
    }).join('')}</div>`;
  };
  D.UI.prototype.drawMinimap=function(){
    const c=document.getElementById('minimap'); if(!c||!this.game.world)return; const ctx=c.getContext('2d'), g=this.game;
    const W=164,H=164;ctx.clearRect(0,0,W,H);
    const sx=W/D.WORLD.w, sy=H/D.WORLD.h;
    for(let y=0;y<D.WORLD.h;y+=2)for(let x=0;x<D.WORLD.w;x+=2){ctx.fillStyle=D.TILES[g.world.tiles[y][x]].color;ctx.fillRect(x*sx,y*sy,Math.ceil(sx*2),Math.ceil(sy*2));}
    ctx.fillStyle='#63e6a4';g.entities.npcs.forEach(n=>ctx.fillRect(n.x/D.TILE*sx-1,n.y/D.TILE*sy-1,3,3));
    ctx.fillStyle='#ff5c7a';g.entities.enemies.slice(0,90).forEach(e=>ctx.fillRect(e.x/D.TILE*sx,e.y/D.TILE*sy,2,2));
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(g.player.x/D.TILE*sx,g.player.y/D.TILE*sy,3,0,Math.PI*2);ctx.fill();
    ctx.save();
    ctx.translate(g.player.x/D.TILE*sx,g.player.y/D.TILE*sy);
    ctx.rotate(g.camera.targetAngle||g.camera.angle||0);
    ctx.strokeStyle='#f7c65b';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,-9);ctx.lineTo(5,4);ctx.lineTo(0,1);ctx.lineTo(-5,4);ctx.closePath();ctx.stroke();
    ctx.restore();
  };
})();
</script>
<script>

(function(){

    return `<div class="stat-sheet"><div class="stat-hero"><div class="paperdoll"><div class="pd-head"></div><div class="pd-body"></div><div class="pd-arm left"></div><div class="pd-arm right"></div><div class="pd-leg left"></div><div class="pd-leg right"></div><div class="pd-boot left"></div><div class="pd-boot right"></div><div class="pd-weapon">${weapon.icon||'👊'}</div><div class="pd-shield">${offhand?.icon||''}</div></div></div><div class="stat-card"><h3>${D.FACTIONS[p.factionId]?.icon||'⚑'} ${p.factionName}</h3><div class="stat-list"><div class="stat-line"><span>Class Story</span><b>${D.getClassStory(p.classId).title}</b></div><div class="stat-line"><span>Faction Buff</span><b>${Object.entries(D.FACTIONS[p.factionId]?.buff||{}).map(([k,v])=>`${k}+${v}`).join(', ')||'None'}</b></div><div class="stat-line"><span>Class / Zone</span><b>${D.CLASSES[p.classId]?.name||p.classId} • ${p.zoneName}</b></div><div class="stat-line"><span>Team Role</span><b>${p.role||D.CLASS_ROLES[p.classId]||'Hybrid'}</b></div><div class="stat-line"><span>Character Level</span><b>${p.characterLevel||1}</b></div><div class="stat-line"><span>Attribute Points</span><b>${p.attributePoints||0}</b></div><div class="stat-line"><span>Combat Style</span><b>${style.toUpperCase()}</b></div><div class="stat-line"><span>Total Skill Level</span><b>${totalLvl}</b></div><div class="stat-line"><span>Combat Level</span><b>${combatLvl}</b></div><div class="stat-line"><span>Health</span><b>${Math.ceil(p.hp)} / ${p.maxHp}</b></div><div class="stat-line"><span>Attack</span><b>${s.attack}</b></div><div class="stat-line"><span>Defense</span><b>${s.defense}</b></div><div class="stat-line"><span>Healing Power</span><b>${s.healingPower}</b></div><div class="stat-line"><span>Support Power</span><b>${s.supportPower}</b></div><div class="stat-line"><span>Crit Chance</span><b>${Math.round((s.critChance||0)*100)}%</b></div><div class="stat-line"><span>Accuracy</span><b>${Math.round(s.accuracy*100)}%</b></div><div class="stat-line"><span>Attack Speed</span><b>${s.attackSpeed.toFixed(2)}s</b></div><div class="stat-line"><span>Range</span><b>${Math.round(s.range)}</b></div><div class="stat-line"><span>Move Speed</span><b>${Math.round(s.moveSpeed)}</b></div></div></div></div><h3 style="margin-top:18px">Attributes</h3><div class="stat-card"><div class="stat-list">${attrRows}</div></div><h3 style="margin-top:18px">Equipment</h3><div class="grid"><div class="item-card"><h3>${head?.icon||'—'} Head</h3><p>${head?.name||'Empty'}</p></div><div class="item-card"><h3>${weapon.icon||'👊'} Weapon</h3><p>${weapon.name}</p></div><div class="item-card"><h3>${offhand?.icon||'—'} Offhand</h3><p>${offhand?.name||'Empty'}</p></div><div class="item-card"><h3>${body?.icon||'—'} Body</h3><p>${body?.name||'Empty'}</p></div><div class="item-card"><h3>${tool?.icon||'—'} Tool</h3><p>${tool?.name||'Empty'}</p></div></div>`;
  };
  D.UI.prototype.addAttribute=function(id){
    const p=this.game.player;if(!p||!D.ATTRIBUTES[id]||(p.attributePoints||0)<=0)return;
    p.attributes=p.attributes||D.defaultAttributes(p.roleType||'hybrid');
    p.attributes[id]=(p.attributes[id]||0)+1;p.attributePoints--;

    this.renderPanel();

  D.UI.prototype.skillsHTML=function(){
    const p=this.game.player;
    return `<table class="table"><thead><tr><th>Skill</th><th>Level</th><th>XP</th><th>Next</th></tr></thead><tbody>${Object.entries(D.SKILLS).map(([id,c])=>{if(!p.skills[id])p.skills[id]={xp:0,level:1};const xp=p.skills[id].xp||0,l=D.levelForXp(xp),next=D.xpForLevel(l+1);return`<tr><td><strong>${c.icon} ${c.name}</strong><br><small style="color:var(--muted)">${c.desc}</small></td><td>${l}</td><td>${xp}</td><td>${next-xp}</td></tr>`}).join('')}</tbody></table><h3>Perks</h3><div class="grid">${p.perks.map(id=>D.PERKS[id]?`<div class="item-card"><h3>${D.PERKS[id].icon} ${D.PERKS[id].name}</h3><p>${D.PERKS[id].desc}</p></div>`:'').join('')||'<div class="help-note">No perks yet.</div>'}</div>`;
  };
  D.UI.prototype.craftingHTML=function(){

  };
  D.UI.prototype.questsHTML=function(){
    const qs=this.game.systems.quests, p=this.game.player, story=D.getClassStory(p.classId), faction=D.FACTIONS[p.factionId]||{};
    const starter=D.getStarterZone(p.classId);
    const classBosses=(D.FACTION_BOSSES||[]).filter(b=>b.classId===p.classId);
    const worldBosses=Object.entries(D.WORLD_BOSSES||{}).map(([id,b])=>({id,...b}));
    const storyCard=`<div class="item-card" style="min-height:auto;border-color:${faction.color||'#f7c65b'}"><h3>${D.CLASSES[p.classId]?.icon||'🧭'} ${story.title}</h3><p>${story.theme}</p><p><b>Faction:</b> ${faction.icon||'⚑'} ${p.factionName}</p><p><b>Starter Region:</b> ${starter.icon} ${starter.name}</p><p><b>Trainer:</b> ${D.getZoneFeature(p.classId).trainer}</p><span class="tag">Class Storyline Active</span></div>`;
    const active=Object.entries(qs.active).map(([id,st])=>{const q=D.QUESTS[id] || D.CLASS_QUESTS?.[id]; if(!q) return ''; return`<div class="item-card"><h3>${q.icon} ${q.name}</h3><p>${q.desc}</p>${q.steps.map((s,i)=>`<p>${(st.progress[i]||0)>=s.qty?'✅':'⬜'} ${s.text} <b>${st.progress[i]||0}/${s.qty}</b></p>`).join('')}</div>`}).join('')||'<div class="help-note">No active quests.</div>';
    const bossCards=classBosses.map(b=>{const f=D.FACTIONS[b.factionId]||{};return`<div class="item-card"><h3>${f.icon||'⚑'} ${b.name}</h3><p><b>Zone:</b> ${b.zone}</p><p><b>Pressure:</b> ${b.rolePressure}</p><p><b>Loot:</b> ${b.lootTable.map(id=>D.ITEMS[id]?.icon||'🎁').join(' ')} ${b.lootTable.map(id=>D.ITEMS[id]?.name||id).join(', ')}</p><span class="tag">Faction Boss Foundation</span></div>`}).join('');
    const worldCards=worldBosses.map(b=>`<div class="item-card"><h3>${b.icon} ${b.name}</h3><p><b>Zone:</b> ${b.zone}</p><p><b>HP:</b> ${b.hp} • <b>Damage:</b> ${b.damage}</p><p><b>Loot:</b> ${b.lootTable.map(id=>D.ITEMS[id]?.icon||'🎁').join(' ')} ${b.lootTable.map(id=>D.ITEMS[id]?.name||id).join(', ')}</p><span class="tag">World Boss Foundation</span></div>`).join('');
    return `<h3>Storyline</h3><div class="grid">${storyCard}</div><h3>Active Quests</h3><div class="grid">${active}</div><h3>Your Class Faction Bosses</h3><div class="grid">${bossCards}</div><h3>Greater World Bosses</h3><div class="grid">${worldCards}</div><h3>Completed</h3><p>${Object.keys(qs.completed).map(id=>(D.QUESTS[id]||D.CLASS_QUESTS?.[id])?.name).filter(Boolean).join(', ')||'None yet.'}</p>`;

  D.UI.prototype.bankHTML=function(){
    const g=this.game, inv=g.systems.inventory.items, bank=g.systems.bank.items;
    const invRows=Object.entries(inv).filter(([id])=>id!=='coin').map(([id,q])=>`<div class="shop-row"><div>${D.ITEMS[id].icon} <b>${D.ITEMS[id].name}</b><small>Backpack x${q}</small></div><button class="small-btn" onclick="event.stopPropagation();Duskfall.game.systems.bank.deposit('${id}',1)">Deposit 1</button><button class="small-btn" onclick="event.stopPropagation();Duskfall.game.systems.bank.deposit('${id}',${q})">All</button></div>`).join('')||'<div class="help-note">No depositable items.</div>';
    const bankRows=Object.entries(bank).map(([id,q])=>`<div class="shop-row"><div>${D.ITEMS[id].icon} <b>${D.ITEMS[id].name}</b><small>Bank x${q}</small></div><button class="small-btn" onclick="event.stopPropagation();Duskfall.game.systems.bank.withdraw('${id}',1)">Withdraw 1</button><button class="small-btn" onclick="event.stopPropagation();Duskfall.game.systems.bank.withdraw('${id}',${q})">All</button></div>`).join('')||'<div class="help-note">Bank empty.</div>';

  D.UI.prototype.mapHTML=function(){

    return `<div class="help-note"><b>${faction.icon||'⚑'} Your Faction:</b> ${p.factionName||'Unknown'} • <b>Class Story:</b> ${story.title}<br>${story.theme}<br><br>The map now marks your starter zone, your faction claim flags, class trainers, faction emissaries, active turf stones, portals, mobs, resources, and your camera direction.</div><div class="map-legend"><span>⚪ you</span><span>🔺 camera heading</span><span>⭐ starter zones</span><span>🚩 faction camps</span><span>🧑‍🏫 class trainers</span><span>⚑ turf claims</span><span>🌀 dungeon</span><span>🟥 mobs</span><span>🟢 NPCs</span></div><canvas id="worldMap" class="map-canvas" width="720" height="720"></canvas>`;
  };
  D.UI.prototype.drawWorldMap=function(){
    const c=document.getElementById('worldMap'); if(!c||!this.game.world)return; const ctx=c.getContext('2d'), g=this.game, W=720,H=720;
    ctx.clearRect(0,0,W,H); const sx=W/D.WORLD.w, sy=H/D.WORLD.h;
    for(let y=0;y<D.WORLD.h;y++)for(let x=0;x<D.WORLD.w;x++){ctx.fillStyle=D.TILES[g.world.tiles[y][x]].color;ctx.fillRect(x*sx,y*sy,Math.ceil(sx),Math.ceil(sy));}
    Object.entries(D.STARTER_ZONES||{}).forEach(([id,z])=>{
      ctx.fillStyle='#f7c65b';ctx.beginPath();ctx.arc(z.x*sx,z.y*sy,8,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ffffff';ctx.font='700 11px Inter';ctx.textAlign='center';ctx.fillText(D.getStarterZone(id).icon,z.x*sx,z.y*sy+4);
      const angleMap={melee:-2.35,warden:-1.55,range:-.78,cleric:0,gatherer:.78,mage:1.55,brawler:2.35,prospector:3.14,wanderer:.35};
      const a=angleMap[id]??0;
      ctx.fillStyle='#ff5c7a';ctx.beginPath();ctx.arc((z.x+Math.cos(a)*(z.r+9))*sx,(z.y+Math.sin(a)*(z.r+9))*sy,6,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';ctx.font='700 9px Inter';ctx.fillText('B',(z.x+Math.cos(a)*(z.r+9))*sx,(z.y+Math.sin(a)*(z.r+9))*sy+3);
      (D.getClassFactions(id)||[]).forEach((fid,i)=>{const f=D.FACTIONS[fid];const ox=i===0?-9:9, oy=i===0?-9:9;ctx.fillStyle=f.color;ctx.beginPath();ctx.arc((z.x+ox)*sx,(z.y+oy)*sy,5,0,Math.PI*2);ctx.fill();});
    });
    ctx.fillStyle='#63e6a4';g.entities.npcs.forEach(n=>{
      const nx=n.x/D.TILE*sx, ny=n.y/D.TILE*sy;
      if(String(n.id).startsWith('trainer_')){ctx.fillStyle='#6aa7ff';ctx.beginPath();ctx.arc(nx,ny,5,0,Math.PI*2);ctx.fill();}
      else if(String(n.id).startsWith('emissary_')){ctx.fillStyle='#f7c65b';ctx.fillRect(nx-4,ny-4,8,8);}
      else {ctx.fillStyle='#63e6a4';ctx.fillRect(nx-3,ny-3,7,7);}
    });
    if(g.systems.turf?.points){g.systems.turf.points.forEach(pt=>{const f=D.FACTIONS[pt.factionId]||{};ctx.strokeStyle=pt.owner?f.color:'#ffffff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(pt.x/D.TILE*sx,pt.y/D.TILE*sy,6,0,Math.PI*2);ctx.stroke();});}
    ctx.fillStyle='#b98cff';g.entities.portals.forEach(p=>{ctx.beginPath();ctx.arc(p.x/D.TILE*sx,p.y/D.TILE*sy,6,0,Math.PI*2);ctx.fill();});
    ctx.fillStyle='#ffcf6e';
    [{x:D.WORLD.w/2,y:D.WORLD.h/2,name:'Dusk Titan'},{x:D.WORLD.w/2+34,y:D.WORLD.h/2-42,name:'Crownless Drake'}].forEach(b=>{ctx.beginPath();ctx.arc(b.x*sx,b.y*sy,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#07090d';ctx.font='900 10px Inter';ctx.textAlign='center';ctx.fillText('WB',b.x*sx,b.y*sy+3);ctx.fillStyle='#ffcf6e';});
    ctx.fillStyle='#ff5c7a';g.entities.enemies.forEach(e=>ctx.fillRect(e.x/D.TILE*sx-1,e.y/D.TILE*sy-1,3,3));
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(g.player.x/D.TILE*sx,g.player.y/D.TILE*sy,5,0,Math.PI*2);ctx.fill();
    ctx.save();ctx.translate(g.player.x/D.TILE*sx,g.player.y/D.TILE*sy);ctx.rotate(g.camera.targetAngle||g.camera.angle||0);ctx.strokeStyle='#f7c65b';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(10,8);ctx.lineTo(0,2);ctx.lineTo(-10,8);ctx.closePath();ctx.stroke();ctx.restore();
  };
})();
</script>
<script>
/* === ui/dialogs.js === */
(function(){
  const D = window.Duskfall = window.Duskfall || {};
  D.UI.prototype.openDialog=function(npc){this.dialogNpc=npc;this.game.paused=true;this.clearInputLocks();document.getElementById('dialog').classList.add('show');this.renderDialog();this.syncLayoutState();};
  D.UI.prototype.closeDialog=function(){this.dialogNpc=null;document.getElementById('dialog').classList.remove('show');this.game.paused=false;this.clearInputLocks();this.syncLayoutState();};
  D.UI.prototype.renderDialog=function(){
    const npc=this.dialogNpc;if(!npc)return; const cfg=npc.cfg, el=document.getElementById('dialog');

<script>
/* === phase3/camera-polish-3a.js ===
   Surgical overlay: keeps the single-file build intact while upgrading the current 2.5D camera into a deeper 3D-feeling aerial camera.
*/
(function(){
  const D = window.Duskfall = window.Duskfall || {};
  if(!D.Camera || D.__phase3aCameraPolish) return;
  D.__phase3aCameraPolish = true;
  D.PHASE3A = {name:'Phase 3A', camera:'3D Aerial', safePatch:true};

  const BaseCamera = D.Camera;
  D.Camera = function(game){
    BaseCamera.call(this,game);
    this.zoom=1.16;this.targetZoom=1.16;this.minZoom=.52;this.maxZoom=2.45;
    this.pitch=.62;this.targetPitch=.62;
    this.focusYBias=68;this.targetFocusYBias=68;
    this.deadzone=20;this.lookAhead=42;
  };
  D.Camera.prototype = BaseCamera.prototype;
  D.Camera.prototype.constructor = D.Camera;

  D.Camera.prototype.modeLabel=function(){return this.game.settings.cameraMode==='top'?'Overhead':'3D Aerial';};
  D.Camera.prototype.snapTo=function(x,y){
    const bias=this.game.settings?.cameraMode==='top'?0:(this.focusYBias||0);
    this.x=x-this.game.viewW/2;this.y=y-this.game.viewH/2-bias;this.clamp();
  };
  D.Camera.prototype.update=function(dt){
    const p=this.game.player;if(!p)return;
    const isAerial=this.game.settings.cameraMode!=='top';
    this.targetPitch=isAerial?(this.targetPitch||.62):1;
    this.targetFocusYBias=isAerial?Math.max(52,Math.min(110,this.game.viewH*.095)):0;
    const leadX=(p.dir?.x||0)*this.lookAhead;
    const leadY=(p.dir?.y||0)*this.lookAhead;
    const targetX=p.x+leadX-this.game.viewW/2;
    const targetY=p.y+leadY-this.game.viewH/2-this.targetFocusYBias;
    const dx=targetX-this.x, dy=targetY-this.y;
    if(Math.hypot(dx,dy)>this.deadzone){
      this.x=D.lerp(this.x,targetX,1-Math.pow(.006,dt));
      this.y=D.lerp(this.y,targetY,1-Math.pow(.006,dt));
    }
    this.zoom=D.lerp(this.zoom,this.targetZoom,1-Math.pow(.018,dt));
    this.angle=D.lerp(this.angle,this.targetAngle,1-Math.pow(.018,dt));
    this.pitch=D.lerp(this.pitch,this.targetPitch,1-Math.pow(.018,dt));
    this.focusYBias=D.lerp(this.focusYBias||0,this.targetFocusYBias||0,1-Math.pow(.018,dt));
    if(this.shake>0) this.shake=Math.max(0,this.shake-dt*12);
    this.clamp();
  };
  D.Camera.prototype.setIso=function(){
    this.game.settings.cameraMode='iso';
    this.targetAngle=0;
    this.targetPitch=.62;
    this.targetZoom=Math.max(this.targetZoom,1.16);
    this.targetFocusYBias=Math.max(52,Math.min(110,this.game.viewH*.095));
    this.game.ui?.toast('Camera Mode','3D aerial view enabled. Q/E rotates, O resets overhead.', 'gold');
  };
  D.Camera.prototype.setOverhead=function(){
    this.game.settings.cameraMode='top';
    this.targetAngle=0;
    this.targetPitch=1;
    this.targetFocusYBias=0;
    this.game.ui?.toast('Camera Mode','Overhead view enabled for precise building and map reading.', 'good');
  };
  D.Camera.prototype.toggleMode=function(){
    if(this.game.settings.cameraMode==='top') this.setIso();
    else this.setOverhead();
  };
  D.Camera.prototype.rotate=function(delta){
    this.targetAngle+=delta;
    if(this.targetAngle>Math.PI)this.targetAngle-=Math.PI*2;
    if(this.targetAngle<-Math.PI)this.targetAngle+=Math.PI*2;
    this.game.settings.cameraMode='iso';
    this.targetPitch=.64;
    this.targetFocusYBias=Math.max(52,Math.min(110,this.game.viewH*.095));
  };
  D.Camera.prototype.apply=function(ctx){
    let sx=0,sy=0;
    if(this.shake>0){sx=(Math.random()-.5)*this.shake*6;sy=(Math.random()-.5)*this.shake*6;}
    const cx=this.x+this.game.viewW/2, cy=this.y+this.game.viewH/2;
    ctx.translate(this.game.viewW/2+sx,this.game.viewH/2+sy);
    const pitch=this.game.settings.cameraMode==='iso'?this.pitch:1;
    ctx.scale(this.zoom,this.zoom*pitch);
    if(Math.abs(this.angle)>0.001) ctx.rotate(this.angle);
    ctx.translate(-cx,-cy);
  };
  D.Camera.prototype.worldToScreen=function(wx,wy){
    const cx=this.x+this.game.viewW/2, cy=this.y+this.game.viewH/2;
    let dx=wx-cx, dy=wy-cy, rx=dx, ry=dy;
    const pitch=this.game.settings.cameraMode==='iso'?this.pitch:1;
    if(Math.abs(this.angle)>0.001){
      const c=Math.cos(this.angle),s=Math.sin(this.angle);
      rx=dx*c-dy*s; ry=dx*s+dy*c;
    }
    return {x:this.game.viewW/2+rx*this.zoom,y:this.game.viewH/2+ry*this.zoom*pitch};
  };
  D.Camera.prototype.screenToWorld=function(sx,sy){
    const cx=this.x+this.game.viewW/2, cy=this.y+this.game.viewH/2;
    let rx=(sx-this.game.viewW/2)/this.zoom;
    const pitch=this.game.settings.cameraMode==='iso'?this.pitch:1;
    let ry=(sy-this.game.viewH/2)/(this.zoom*pitch);
    if(Math.abs(this.angle)>0.001){
      const c=Math.cos(-this.angle),s=Math.sin(-this.angle);
      const dx=rx*c-ry*s, dy=rx*s+ry*c;
      return {x:cx+dx,y:cy+dy};
    }
    return {x:cx+rx,y:cy+ry};
  };

  const baseRenderMenu = D.UI?.prototype?.renderMenu;
  if(baseRenderMenu){
    D.UI.prototype.renderMenu=function(){
      baseRenderMenu.call(this);
      const menu=document.getElementById('menu');
      if(!menu || this.game.state==='play')return;
      const card=menu.querySelector('.menu-card');
      if(card && !card.querySelector('.phase-strip')){
        const strip=document.createElement('div');
        strip.className='phase-strip';
        strip.innerHTML='<span class="phase-chip">Phase 3A Build</span><span class="phase-chip">Camera: 3D Aerial</span><span class="phase-chip">Safe Single-File Patch</span><span class="phase-chip">Class + Faction Ready</span>';
        const h1=card.querySelector('h1');
        if(h1) h1.insertAdjacentElement('afterend',strip);
      }
      menu.querySelectorAll('.class-card .menu-actions').forEach(row=>row.classList.add('faction-row'));
      menu.querySelectorAll('.class-card .small-btn').forEach(btn=>{
        btn.classList.add('faction-choice');
        if(!btn.querySelector('small')) btn.insertAdjacentHTML('beforeend','<small>Locks story path, HUD faction, map flags</small>');
      });
    };
  }

  const basePause = D.UI?.prototype?.renderPauseMenu;
  if(basePause){
    D.UI.prototype.renderPauseMenu=function(){
      basePause.call(this);
      const menu=document.getElementById('menu');
      const camCard=[...menu.querySelectorAll('.setting-card')].find(el=>el.querySelector('h3')?.textContent==='Camera');
      if(camCard && !camCard.querySelector('.camera-readout')){
        camCard.insertAdjacentHTML('beforeend',`<div class="camera-readout"><b>3D Aerial polish:</b> camera is pitched lower, player sits slightly lower on screen, visible bounds are widened, and targeting still uses inverse screen-to-world math.</div>`);
      }
    };
  }
})();
</script>

    console.assert(Object.values(D.STARTER_ZONES).every(z=>z.r>=28), 'Smoke test failed: Phase 1 starter zones must be 2x+ larger.');
    console.assert(D.ZONE_FEATURES && Object.keys(D.ZONE_FEATURES).length===9, 'Smoke test failed: zone feature definitions missing.');

    console.assert(typeof D.Camera.prototype.rotate === 'function', 'Smoke test failed: camera rotate control missing.');
    const camSmoke={viewW:1280,viewH:720,settings:{cameraMode:'iso'},ui:{toast(){}}};

    console.assert(typeof D.UI.prototype.syncLayoutState === 'function', 'Smoke test failed: UI layout state manager missing.');
    const tmpGame={buildMode:false,ui:{toast(){},log(){},floatText(){}},input:{mouse:{}},systems:{inventory:{canAfford(){return true},take(){return true}}},player:{x:D.WORLD.pxW/2,y:D.WORLD.pxH/2,blocking:false},entities:{npcs:[],enemies:[]},world:testWorld};

    console.assert(D.getClassFactions('melee').length===2, 'Smoke test failed: class faction choices missing.');

    const popSmoke={seed:999,world:testWorld,entities:{resources:[],enemies:[],npcs:[],portals:[],projectiles:[],drops:[],effects:[]}};
    D.populateWorld(popSmoke);
    console.assert(popSmoke.entities.npcs.filter(n=>String(n.id).startsWith('trainer_')).length===9, 'Smoke test failed: 9 class trainers not spawned.');

    console.assert(D.MOUNTS && D.PETS, 'Smoke test failed: mount/pet foundations missing.');
    console.assert(typeof D.characterLevelForXp === 'function' && typeof D.defaultAttributes === 'function', 'Smoke test failed: character level / attribute foundations missing.');
    console.assert(D.ITEMS.training_bow && D.ITEMS.oak_staff && D.ITEMS.bronze_helm, 'Smoke test failed: expanded class gear missing.');
    console.assert(typeof D.UI.prototype.statsHTML === 'function', 'Smoke test failed: character stat panel missing.');
    const combatSmoke=new D.CombatSystem({input:{mouse:{worldX:0,worldY:0}}});
    console.assert(typeof combatSmoke.rollBonusHit === 'function' && typeof combatSmoke.weaponStyle === 'function', 'Smoke test failed: crit/headshot combat helpers missing.');
    console.assert(combatSmoke.heavyThreshold >= .7, 'Smoke test failed: heavy attack threshold too low.');
    console.assert(typeof combatSmoke.isEnemyNearAimLine === 'function', 'Smoke test failed: ranged aim-line targeting helper missing.');
    console.assert(typeof combatSmoke.spawnAttackProjectile === 'function', 'Smoke test failed: ranged projectile helper missing.');
    console.assert(D.getRecipe('training_bow') && D.getRecipe('leather_hood') && D.getRecipe('ranger_tunic'), 'Smoke test failed: craftable starter gear missing.');
    console.assert(typeof D.UI.prototype.clearInputLocks === 'function', 'Smoke test failed: UI input lock cleanup missing.');
    console.assert(D.TILE===32, 'Smoke test failed: tile size should be reduced from chunky 48px tiles.');
  };
  try{D.runSmokeTests();}catch(err){console.error('Smoke test crash prevented:',err);}
  console.assert(typeof D.createPlayer === 'function', 'Smoke test failed: player factory missing.');
  const smokeGame={
    input:{axis(){return{x:0,y:0}},mouse:{}},
    world:D.generateWorld(777),
    systems:{inventory:{add(){return true}},perks:{reapply(){}}},
    ui:{toast(){},log(){},floatText(){}},
    camera:{snapTo(){}},
    entities:{drops:[]},
    stats:{deaths:0},settings:{hungerEnabled:false}
  };
  const smokePlayer=D.createPlayer(smokeGame,'melee','ironbound');
  console.assert(smokePlayer && smokePlayer.equipment.head === 'bronze_helm', 'Smoke test failed: class/faction player creation failed.');
  console.assert(smokePlayer.factionName === D.FACTIONS.ironbound.name, 'Smoke test failed: faction assignment failed.');
  console.assert(smokePlayer.attributes && smokePlayer.attributePoints >= 0, 'Smoke test failed: player attributes missing.');
  try{
    D.game = new D.Game();
    D.game.init();
  }catch(err){
    console.error('UNK-SCAPE boot crash:',err);
    document.body.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;background:#07090d;color:#e9f0ff;font-family:Inter,Arial;padding:30px"><div style="max-width:760px;border:1px solid rgba(255,255,255,.16);border-radius:22px;background:rgba(18,24,38,.94);padding:24px;box-shadow:0 22px 70px rgba(0,0,0,.45)"><h1 style="margin:0 0 10px">UNK-SCAPE Preview Boot Guard</h1><p>The game hit a startup error, but the page is no longer hard-crashing. Open the browser console for the exact stack.</p><pre style="white-space:pre-wrap;color:#ff9b5c;background:rgba(0,0,0,.28);padding:14px;border-radius:14px">'+String(err&&err.stack||err)+'</pre></div></div>';
  }
});
